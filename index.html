                    <button class="ctl big" id="ps-playpause" onclick="Passive.toggle()" aria-label="Phát / Tạm dừng">▶</button>
                    <button class="ctl" onclick="Passive.skip(1)" aria-label="Từ kế tiếp">⏭</button>
                  </div>

                  <div class="flex items-center justify-between gap-2 mt-5">
                    <div class="flex items-center gap-1.5">
                      ${[0.75, 0.9, 1.0, 1.15, 1.25].map(r => `<button onclick="Passive.setRate(${r})" class="px-2.5 py-1.5 rounded-lg text-[11px] font-bold ${Math.abs(rate - r) < 0.01 ? 'bg-white text-indigo-700' : 'bg-white/10 text-indigo-100'}">${r}×</button>`).join('')}
                    </div>
                    <button onclick="Passive.stopAll()" class="px-3 py-1.5 rounded-lg text-[11px] font-bold bg-rose-500/80 text-white">⏹ Dừng</button>
                  </div>

                  <div id="ps-sleep-pill" class="hidden mt-4 text-center text-xs font-bold text-amber-200 glass rounded-xl py-2">⏱ Tự dừng sau <span id="ps-sleep-left">--:--</span></div>
                </div>
              </section>

              <!-- ===== TÙY CHỌN ===== -->
              <section class="lg:col-span-3 space-y-4">
                <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-4 sm:p-5">
                  <div class="opt-label mb-3">1 · Chế độ nghe</div>
                  <div class="grid sm:grid-cols-2 gap-2.5">
                    ${modes.map(m => `
                      <button class="mode-card ${c.mode === m.v ? 'on' : ''}" onclick="Passive.setCfg('mode', ${m.v})">
                        <div class="text-sm font-extrabold text-slate-900 dark:text-white">${m.icon} ${m.t}</div>
                        <div class="text-xs text-slate-500 dark:text-slate-400 mt-1 leading-snug">${m.d}</div>
                      </button>`).join('')}
                  </div>
                </div>

                <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-4 sm:p-5 space-y-5">
                  <div>
                    <div class="opt-label mb-2">2 · Phạm vi nghe</div>
                    <div class="space-y-2.5">
                      <div class="flex gap-2 overflow-x-auto pb-1">
                        ${levels.map(lv => `<button class="chip shrink-0 ${lv === level ? 'on' : ''}" onclick="Passive.setLevel('${lv}')">${lv}</button>`).join('')}
                      </div>
                      <div class="flex flex-wrap gap-2 max-h-44 overflow-y-auto pr-1">
                        <button class="chip ${allLessonsSel ? 'on' : ''}" onclick="Passive.selectAllLessons()">Tất cả bài (${lvLessons.length})</button>
                        ${lvLessons.map((m, i) => `<button class="chip ${!allLessonsSel && selIds.includes(m.id) ? 'on' : ''}" title="${Renderer.escapeHtml(m.title)}" onclick="Passive.toggleLesson('${m.id}')">Bài ${m.number || i + 1}</button>`).join('')}
                      </div>
                      <div class="flex flex-wrap gap-2">
                        <button class="chip ${allGroups ? 'on' : ''}" onclick="Passive.selectAllGroups()">Tất cả nhóm</button>
                        ${Array.from({ length: nGroups }, (_, i) => `<button class="chip ${!allGroups && c.groups.includes(i) ? 'on' : ''}" onclick="Passive.toggleGroupIdx(${i})">Nhóm ${i + 1}</button>`).join('')}
                      </div>
                      <p class="text-xs text-slate-500 dark:text-slate-400">
                        ${loadingN ? `⏳ Đang tải ${loadingN} bài...` : `Sẽ nghe ${expected} từ từ ${selIds.length} bài của ${level}.`}
                      </p>
                      ${failedMsgs.length ? `<p class="text-xs text-rose-600 dark:text-rose-400">⚠ ${Renderer.escapeHtml(failedMsgs[0])}</p>` : ''}
                    </div>
                  </div>

                  <div class="${podcast ? 'opacity-50' : ''}">
                    <div class="opt-label mb-2">3 · Số lần đọc lặp tiếng Trung ${podcast ? '<span class="normal-case tracking-normal font-semibold text-slate-400">(không áp dụng cho Podcast)</span>' : ''}</div>
                    <div class="flex flex-wrap gap-2">${seg('repeat', [{ v: 1, label: '1 lần' }, { v: 2, label: '2 lần' }, { v: 3, label: '3 lần' }])}</div>
                  </div>

                  <div class="${podcast ? 'opacity-50' : ''}">
                    <div class="opt-label mb-2">4 · Nghỉ sau câu tiếng Trung (Shadowing)</div>
                    <div class="flex flex-wrap gap-2">${seg('pause', [{ v: 1000, label: '1 giây · nghe liên tục' }, { v: 3000, label: '3 giây · đọc nhại theo' }])}</div>
                  </div>

                  <div>
                    <div class="opt-label mb-2">5 · Chế độ phát</div>
                    <div class="flex flex-wrap gap-2">${seg('order', [{ v: 'seq', label: '➡ Tuần tự' }, { v: 'shuffle', label: '🔀 Trộn ngẫu nhiên' }, { v: 'loop', label: '🔁 Lặp vô tận' }])}</div>
                  </div>

                  <div>
                    <div class="opt-label mb-2">6 · Hẹn giờ tắt</div>
                    <div class="flex flex-wrap gap-2">${seg('sleep', [{ v: 15, label: '15 phút' }, { v: 30, label: '30 phút' }, { v: 60, label: '60 phút' }, { v: 'end', label: 'Hết danh sách' }])}</div>
                    ${c.order === 'loop' && c.sleep === 'end' ? '<p class="text-xs text-amber-600 dark:text-amber-400 mt-2">Đang lặp vô tận: nên chọn 15 / 30 / 60 phút để tự dừng khi ngủ.</p>' : ''}
                  </div>

                  <label class="flex items-center justify-between gap-3 cursor-pointer pt-1">
                    <span class="text-sm font-semibold text-slate-700 dark:text-slate-200">Giữ màn hình sáng khi đang phát<br><span class="text-xs font-normal text-slate-500">Một số máy sẽ ngừng đọc khi tắt màn hình.</span></span>
                    <input type="checkbox" class="w-5 h-5 accent-indigo-600" ${c.wake ? 'checked' : ''} onchange="Passive.setCfg('wake', this.checked)">
                  </label>
                </div>

                <!-- Danh sách từ trong phạm vi -->
                <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-4 sm:p-5">
                  <div class="flex items-center justify-between mb-3">
                    <div class="opt-label">Danh sách phát · ${scoped.length} từ</div>
                    <span class="text-[11px] text-slate-500">Chạm một từ để nghe từ đó</span>
                  </div>
                  <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
                    ${scoped.slice(0, 72).map(x => `
                      <button id="ps-w-${x.w.id}" class="ps-word" onclick="Passive.jump('${x.w.id}')">
                        <div class="hanzi-text text-base font-black text-slate-900 dark:text-white">${this.escapeHtml(x.w.hanzi)}</div>
                        <div class="text-[11px] text-slate-500 dark:text-slate-400 truncate">${this.escapeHtml(x.w.pinyin)} · ${this.escapeHtml(x.w.coreMeaning)}</div>
                      </button>`).join('')}
                  </div>
                  ${scoped.length > 72 ? `<p class="text-xs text-slate-500 mt-3">Hiển thị 72 từ đầu. Toàn bộ ${scoped.length} từ vẫn được phát.</p>` : ''}
                </div>
              </section>
            </div>
          </div>
        `;
      },

      // === B. MÀN HÌNH BÀI HỌC & CHI TIẾT TỪ VỰNG ===
      renderLessonView() {
        const curLesson = AppStore.currentLesson || AppStore.lessons[0];
        const curGroup = AppStore.currentGroup || curLesson.groups[0];
        const curWord = AppStore.currentWord || (curGroup ? curGroup.words[0] : null);

        if (!curGroup || !curWord) {
          return `<div class="p-8 text-center text-slate-500">Bài học này chưa có nội dung nhóm.</div>`;
        }

        const wordIdxInGroup = curGroup.words.findIndex(w => w.id === curWord.id);
        const prevWord = wordIdxInGroup > 0 ? curGroup.words[wordIdxInGroup - 1] : null;
        const nextWord = wordIdxInGroup < curGroup.words.length - 1 ? curGroup.words[wordIdxInGroup + 1] : null;

        const progress = Storage.getProgress();
        const isCompleted = Boolean(progress.completedWords[curWord.id]);
        const isBookmarked = Boolean(progress.bookmarks[curWord.id]);

        return `
          <div class="space-y-6">
            <!-- Navigation Header -->
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-sm space-y-3">
              <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-100 dark:border-slate-800 pb-3">
                <div>
                  <button onclick="Router.navigate('home')" class="text-xs font-bold text-indigo-600 dark:text-indigo-400 uppercase tracking-wider hover:underline text-left">◀ Thư viện · ${curLesson.level} • ${curLesson.title}</button>
                  <h3 class="text-base font-bold text-slate-900 dark:text-white">${curGroup.title}</h3>
                </div>
                <!-- Dropdown đổi nhóm nhanh -->
                <select onchange="Renderer.onSelectGroup(this.value)" class="bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-semibold rounded-xl px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                  ${curLesson.groups.map(g => `
                    <option value="${g.id}" ${g.id === curGroup.id ? 'selected' : ''}>${g.title}</option>
                  `).join('')}
                </select>
              </div>

              <!-- Thanh chuyển từ trong nhóm -->
              <div class="flex items-center gap-2 overflow-x-auto pb-1">
                ${curGroup.words.map((w) => `
                  <button onclick="Router.navigate('lesson', { lessonId: '${curLesson.id}', groupId: '${curGroup.id}', wordId: '${w.id}' })"
                    class="touch-target px-3 py-1.5 rounded-xl border text-xs font-semibold whitespace-nowrap transition flex items-center gap-1.5 ${w.id === curWord.id ? 'bg-indigo-600 text-white border-indigo-600 shadow' : 'bg-slate-50 dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300'}">
                    <span class="opacity-75">#${w.index}</span>
                    <span class="hanzi-text font-bold text-sm">${w.hanzi}</span>
                  </button>
                `).join('')}
              </div>
            </div>

            <!-- CARD CHI TIẾT TỪ VỰNG -->
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 sm:p-8 shadow-sm space-y-6">
              <!-- Tiêu đề từ vựng & Giới thiệu Pinyin duy nhất -->
              <div class="flex flex-wrap items-center justify-between gap-4 border-b border-slate-100 dark:border-slate-800 pb-5">
                <div class="flex items-center gap-4 sm:gap-6">
                  <div class="w-20 h-20 sm:w-24 sm:h-24 rounded-2xl bg-indigo-50 dark:bg-indigo-950/60 border border-indigo-100 dark:border-indigo-900 flex items-center justify-center shrink-0 shadow-inner">
                    <span class="hanzi-text text-4xl sm:text-5xl font-black text-indigo-600 dark:text-indigo-400">${curWord.hanzi}</span>
                  </div>
                  <div>
                    <div class="flex items-center gap-2">
                      <span class="text-xs font-bold text-slate-400 uppercase">Từ #${curWord.index}</span>
                      <button onclick="Renderer.toggleBookmark('${curWord.id}')" class="text-sm ${isBookmarked ? 'text-amber-500' : 'text-slate-300 dark:text-slate-600'} hover:scale-110 transition" title="Đánh dấu từ quan trọng">
                        ★
                      </button>
                    </div>
                    <h2 class="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white mt-0.5">${curWord.coreMeaning}</h2>

                    <!-- 5.1 Giới thiệu từ mới (Nơi DUY NHẤT có Pinyin theo quy chuẩn) -->
                    <div class="mt-2.5 inline-flex items-center gap-2 px-3 py-1 rounded-xl bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800 text-xs font-semibold text-amber-900 dark:text-amber-200">
                      <span>Pinyin:</span>
                      <span class="font-bold text-sm tracking-wide font-mono">${curWord.pinyin}</span>
                      <button onclick="TTS.playQueue(${Renderer.escapeJsonAttr(curWord.introAudio)}, 'Từ #${curWord.index}: Giới thiệu')" class="touch-target ml-1 px-2.5 py-1 rounded-lg bg-amber-600 hover:bg-amber-700 text-white font-bold text-xs shadow-sm">
                        🔊 Nghe phát âm
                      </button>
                    </div>
                  </div>
                </div>

                <div class="flex flex-col sm:items-end gap-2 w-full sm:w-auto">
                  <button onclick="Renderer.playSequentialLecture('${curWord.id}')" class="touch-target w-full sm:w-auto px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs sm:text-sm shadow-md flex items-center justify-center gap-2">
                    <span>▶ Nghe giảng tuần tự toàn bài</span>
                  </button>
                  <span class="text-[11px] text-slate-400">Giảng liền mạch từ nghĩa, ví dụ tới bẫy</span>
                </div>
              </div>

              <!-- 5.2 HIỂU NGHĨA & ĐIỀU KIỆN DÙNG -->
              <div class="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200/80 dark:border-slate-800 space-y-2">
                <div class="flex items-center justify-between">
                  <h4 class="font-bold text-sm text-slate-900 dark:text-white">5.2. Hiểu nghĩa và điều kiện sử dụng</h4>
                  <button onclick="TTS.playQueue(${Renderer.escapeJsonAttr(curWord.meaning.audio)}, 'Từ #${curWord.index}: Hiểu nghĩa')" class="touch-target px-3 py-1 rounded-lg bg-indigo-100 dark:bg-indigo-900/60 text-indigo-800 dark:text-indigo-200 text-xs font-semibold">
                    🔊 Nghe giảng nghĩa
                  </button>
                </div>
                <p class="text-xs sm:text-sm text-slate-700 dark:text-slate-300"><strong>• Tình huống:</strong> ${curWord.meaning.situation}</p>
                ${curWord.meaning.detail ? `<p class="text-xs sm:text-sm text-slate-700 dark:text-slate-300"><strong>• Bản chất & Điều kiện dùng:</strong> ${curWord.meaning.detail}</p>` : ''}
                <p class="text-xs sm:text-sm font-semibold text-indigo-900 dark:text-indigo-300"><strong>• Chốt ý:</strong> ${curWord.meaning.keyPoint}</p>
              </div>

              <!-- 5.3 CÁCH SỬ DỤNG: KHUNG CÂU & VỊ TRÍ -->
              <div class="space-y-3">
                <h4 class="font-bold text-sm text-slate-900 dark:text-white">5.3. Cách sử dụng chi tiết: Khung câu & Vị trí</h4>
                <div class="grid gap-3">
                  ${curWord.structures.map((st, sIdx) => `
                    <div class="p-4 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 space-y-2">
                      <div class="flex items-center justify-between">
                        <span class="font-bold text-xs text-indigo-700 dark:text-indigo-300">${st.title}</span>
                        <button onclick="TTS.playQueue(${Renderer.escapeJsonAttr(st.audio)}, 'Cấu trúc ${sIdx + 1}')" class="touch-target px-2.5 py-1 rounded-lg bg-indigo-50 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300 text-xs font-semibold">
                          🔊 Nghe khung câu
                        </button>
                      </div>
                      <div class="hanzi-text text-base font-bold text-slate-900 dark:text-white bg-amber-50/70 dark:bg-amber-950/30 px-3.5 py-2 rounded-xl border border-amber-200/80 dark:border-amber-900/60">
                        ${Renderer.highlightWord(st.pattern, curWord.hanzi)}
                      </div>
                      <p class="text-xs text-slate-600 dark:text-slate-400">${st.note}</p>
                    </div>
                  `).join('')}
                </div>
              </div>

              <!-- 5.4 VÍ DỤ THỰC TẾ -->
              <div class="space-y-3">
                <div class="flex items-center justify-between">
                  <h4 class="font-bold text-sm text-slate-900 dark:text-white">5.4. Ví dụ thực tế (Chữ Hán rõ nét - Ẩn/Hiện nghĩa)</h4>
                  <span class="text-[11px] text-slate-400">Nghe & nhại câu chuẩn</span>
                </div>
                <div class="grid gap-3">
                  ${curWord.examples.map((ex) => `
                    <div class="p-4 rounded-2xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
                      <div class="space-y-1">
                        <div class="hanzi-text text-xl sm:text-2xl font-bold text-slate-900 dark:text-white tracking-wide">
                          ${Renderer.highlightWord(ex.zh, curWord.hanzi)}
                        </div>
                        <details class="text-xs sm:text-sm text-slate-600 dark:text-slate-400 cursor-pointer">
                          <summary class="text-indigo-600 dark:text-indigo-400 font-semibold hover:underline">👁 Xem nghĩa tiếng Việt & Phân tích</summary>
                          <div class="pt-1 font-medium text-slate-800 dark:text-slate-200">${ex.vi}</div>${ex.analysis ? `<div class="text-[11px] text-slate-500 mt-1">${ex.analysis}</div>` : ''}
                        </details>
                      </div>
                      <div class="flex items-center gap-2 self-end sm:self-center shrink-0">
                        ${ex.explainAudio && ex.explainAudio.length ? `
                          <button onclick="TTS.playQueue(${Renderer.escapeJsonAttr(ex.explainAudio)}, 'Phân tích ví dụ')" class="touch-target px-3 py-1.5 rounded-xl bg-indigo-50 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300 text-xs font-semibold">
                            🔊 Lời giảng
                          </button>
                        ` : ''}
                        <button onclick="TTS.playQueue([{lang:'zh-CN', text:${JSON.stringify(ex.zh)}, pause:1500}, {lang:'vi-VN', text:'Mời bạn nhắc lại.'}], 'Nghe câu ví dụ')" class="touch-target px-3 py-1.5 rounded-xl bg-emerald-50 dark:bg-emerald-950/60 hover:bg-emerald-100 text-emerald-800 dark:text-emerald-200 border border-emerald-200 dark:border-emerald-800 text-xs font-bold">
                          🔊 Nghe & Nhại
                        </button>
                      </div>
                    </div>
                  `).join('')}
                </div>
              </div>

              <!-- 5.5 BẪY VÀ PHÂN BIỆT (TRAPS & DISTINCTIONS) -->
              ${curWord.traps.length > 0 ? `
                <div class="space-y-3">
                  <h4 class="font-bold text-sm text-rose-700 dark:text-rose-400">⚠️ 5.5. Bẫy người Việt hay mắc & Cách phân biệt</h4>
                  <div class="grid gap-4">
                    ${curWord.traps.map((t, tIdx) => `
                      <div class="p-4 sm:p-5 rounded-2xl bg-rose-50/70 dark:bg-rose-950/30 border border-rose-200 dark:border-rose-900/60 space-y-3">
                        <div class="flex items-center justify-between">
                          <span class="font-bold text-rose-900 dark:text-rose-200 text-sm">${t.name}</span>
                          <button onclick="TTS.playQueue(${Renderer.escapeJsonAttr(t.audio)}, 'Phân tích bẫy ${tIdx + 1}')" class="touch-target px-3 py-1 rounded-lg bg-rose-200 dark:bg-rose-900/60 text-rose-900 dark:text-rose-100 text-xs font-semibold">
                            🔊 Nghe phân tích bẫy
                          </button>
                        </div>
                        <p class="text-xs sm:text-sm text-slate-700 dark:text-slate-300"><strong>• Tình huống:</strong> ${t.situation}</p>
                        <p class="text-xs sm:text-sm text-slate-700 dark:text-slate-300"><strong>• Bản chất khác biệt:</strong> ${t.explanation}</p>

                        <!-- So sánh đúng / sai -->
                        <div class="grid sm:grid-cols-2 gap-2 pt-1">
                          <div class="p-3 rounded-xl bg-rose-100/80 dark:bg-rose-900/40 border border-rose-300 dark:border-rose-800 text-xs sm:text-sm">
                            <span class="font-bold text-rose-800 dark:text-rose-300">${t.wrong ? '❌ Sai:' : '↔ Đối chiếu:'}</span>
                            <span class="hanzi-text font-bold text-rose-950 dark:text-rose-100 ml-1">${t.wrong || 'Xem câu đối chiếu'}</span>
                          </div>
                          <div class="p-3 rounded-xl bg-emerald-100/80 dark:bg-emerald-900/40 border border-emerald-300 dark:border-emerald-800 text-xs sm:text-sm">
                            <span class="font-bold text-emerald-800 dark:text-emerald-300">✅ Chuẩn:</span>
                            <span class="hanzi-text font-bold text-emerald-950 dark:text-emerald-100 ml-1">${Renderer.highlightWord(t.right, curWord.hanzi)}</span>
                          </div>
                        </div>

                        <!-- Cặp câu đối chiếu ít đổi thành phần nếu có -->
                        ${t.comparisons && t.comparisons.length ? `
                          <div class="p-3 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 space-y-1.5 text-xs">
                            <div class="font-bold text-slate-700 dark:text-slate-300">🔍 Cặp câu đối chiếu ngữ cảnh:</div>
                            ${t.comparisons.map(cp => `
                              <div class="flex flex-col sm:flex-row sm:items-center justify-between border-b border-slate-100 dark:border-slate-700/60 pb-1 last:border-0 last:pb-0">
                                <span class="hanzi-text font-bold text-slate-900 dark:text-white">${cp.zh}</span>
                                <span class="text-slate-500">${cp.vi}</span>
                              </div>
                            `).join('')}
                          </div>
                        ` : ''}

                        <p class="text-xs font-bold text-rose-900 dark:text-rose-300">💡 Mẹo chọn nhanh: ${t.tip}</p>

                        <!-- Mini quiz kiểm tra bẫy -->
                        ${t.checkQuestion ? `
                          <div class="pt-3 border-t border-rose-200 dark:border-rose-900/60 space-y-2">
                            <div class="text-xs font-bold uppercase text-rose-800 dark:text-rose-300">${t.checkQuestion.q}</div>
                            <div class="flex flex-wrap gap-2">
                              ${t.checkQuestion.options.map((opt, oIdx) => `
                                <button onclick="Renderer.checkTrapMiniQuiz('${curWord.id}', ${tIdx}, ${oIdx})" class="touch-target px-3.5 py-1.5 rounded-xl border text-xs font-bold hanzi-text bg-white dark:bg-slate-800 hover:bg-slate-50 border-slate-300 dark:border-slate-700">
                                  ${opt}
                                </button>
                              `).join('')}
                            </div>
                            <div id="trap-feedback-${curWord.id}-${tIdx}" class="hidden p-2.5 rounded-xl text-xs font-semibold"></div>
                          </div>
                        ` : ''}
                      </div>
                    `).join('')}
                  </div>
                </div>
              ` : ''}

              <!-- 5.6 & 5.7 & 5.8: PHÁT ÂM, NHỚ CHỮ & CHỐT DÙNG -->
              <div class="grid sm:grid-cols-3 gap-3">
                <div class="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 space-y-2">
                  <div class="flex items-center justify-between">
                    <h5 class="font-bold text-xs text-slate-900 dark:text-white">5.6. Luyện đọc</h5>
                    <button onclick="TTS.playQueue(${Renderer.escapeJsonAttr(curWord.pron.audio)}, 'Luyện đọc')" class="touch-target px-2 py-0.5 rounded bg-emerald-600 text-white text-[11px] font-semibold">🔊 Nghe</button>
                  </div>
                  <p class="text-xs text-slate-600 dark:text-slate-400">${curWord.pron.guide}</p>
                </div>

                <div class="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 space-y-2">
                  <div class="flex items-center justify-between">
                    <h5 class="font-bold text-xs text-slate-900 dark:text-white">5.7. Nhớ mặt chữ</h5>
                    <button onclick="TTS.playQueue(${Renderer.escapeJsonAttr(curWord.write.audio)}, 'Mẹo nhớ chữ')" class="touch-target px-2 py-0.5 rounded bg-indigo-100 dark:bg-indigo-900 text-indigo-800 dark:text-indigo-200 text-[11px] font-semibold">🔊 Nghe</button>
                  </div>
                  <p class="text-xs text-slate-600 dark:text-slate-400">${curWord.write.desc}</p>
                </div>

                <div class="p-4 rounded-2xl bg-indigo-50/70 dark:bg-indigo-950/40 border border-indigo-200 dark:border-indigo-900 space-y-2">
                  <div class="flex items-center justify-between">
                    <h5 class="font-bold text-xs text-indigo-950 dark:text-indigo-200">5.8. Chốt cách dùng</h5>
                    <button onclick="TTS.playQueue(${Renderer.escapeJsonAttr(curWord.summaryAudio.length ? curWord.summaryAudio : [{lang:'vi-VN', text: curWord.summary}])}, 'Chốt cách dùng')" class="touch-target px-2 py-0.5 rounded bg-indigo-600 text-white text-[11px] font-semibold">🔊 Nghe</button>
                  </div>
                  <p class="text-xs text-indigo-900 dark:text-indigo-300 font-medium">${curWord.summary}</p>
                </div>
              </div>

              <!-- Ghi chú cá nhân -->
              <div class="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 space-y-2">
                <label class="block text-xs font-bold uppercase text-slate-500">📝 Ghi chú cá nhân cho từ này (Tự động lưu):</label>
                <input type="text" oninput="Renderer.onSaveWordNote('${curWord.id}', this.value)" value="${Renderer.escapeHtml(progress.notes[curWord.id] || '')}" placeholder="Ghi lại mẹo của bạn hoặc câu bạn tự nghĩ ra..." class="w-full px-3.5 py-2 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
              </div>

              <!-- Chuyển từ & Đánh dấu hoàn thành -->
              <div class="flex flex-wrap items-center justify-between gap-3 pt-3 border-t border-slate-100 dark:border-slate-800">
                <div class="flex items-center gap-2">
                  ${prevWord ? `
                    <button onclick="Router.navigate('lesson', { lessonId: '${curLesson.id}', groupId: '${curGroup.id}', wordId: '${prevWord.id}' })" class="touch-target px-4 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-semibold text-xs hover:bg-slate-200">
                      ← Từ trước (#${prevWord.index})
                    </button>
                  ` : ''}
                  ${nextWord ? `
                    <button onclick="Router.navigate('lesson', { lessonId: '${curLesson.id}', groupId: '${curGroup.id}', wordId: '${nextWord.id}' })" class="touch-target px-4 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-semibold text-xs hover:bg-slate-200">
                      Từ sau (#${nextWord.index}) →
                    </button>
                  ` : ''}
                </div>

                <button onclick="Renderer.toggleCompleteWord('${curWord.id}')" class="touch-target px-5 py-2.5 rounded-xl font-bold text-xs sm:text-sm transition flex items-center gap-2 ${isCompleted ? 'bg-emerald-600 text-white hover:bg-emerald-700' : 'bg-indigo-600 text-white hover:bg-indigo-700'}">
                  <span>${isCompleted ? '✓ Đã hoàn thành từ này (Nhấn để hủy)' : 'Đánh dấu đã hiểu từ này ➔'}</span>
                </button>
              </div>
            </div>
          </div>
        `;
      },

      // === C. MÀN HÌNH BÀI TẬP & TỰ DÙNG TỪ ===
      renderExerciseView() {
        const curLesson = AppStore.currentLesson || AppStore.lessons[0];
        const curGroup = AppStore.currentGroup || curLesson.groups[0];
        const progress = Storage.getProgress();

        return `
          <div class="space-y-6">
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 shadow-sm">
              <button onclick="Router.navigate('home')" class="text-xs font-bold text-indigo-600 dark:text-indigo-400 uppercase tracking-wider hover:underline text-left">◀ Thư viện · ${curLesson.level} • ${curLesson.title}</button>
              <h2 class="text-xl font-bold text-slate-900 dark:text-white mt-1">Luyện Tập: ${curGroup.title}</h2>
              <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-1">
                Làm bài trắc nghiệm kiểm tra phản xạ và thực hành tự đặt câu với 3 tầng trợ giúp.
              </p>
            </div>

            <!-- 1. BÀI TẬP TRẮC NGHIỆM & NGHE HIỂU -->
            <div class="space-y-4">
              <h3 class="text-base font-bold text-slate-900 dark:text-white">1. Bài tập trắc nghiệm & Nghe hiểu (${curGroup.exercises.length} câu)</h3>
              <div class="grid gap-4">
                ${curGroup.exercises.map((ex, exIdx) => {
                  const saved = progress.completedExercises[ex.id];
                  const hasAnswered = saved !== undefined;
                  const isCorrect = hasAnswered && saved.selected === ex.correct;

                  return `
                    <div class="p-5 rounded-2xl bg-white dark:bg-slate-900 border ${hasAnswered ? (isCorrect ? 'border-emerald-300 dark:border-emerald-800 bg-emerald-50/20' : 'border-rose-300 dark:border-rose-800 bg-rose-50/20') : 'border-slate-200 dark:border-slate-800'} space-y-3">
                      <div class="flex flex-wrap items-center justify-between gap-2">
                        <span class="px-2.5 py-0.5 rounded-lg bg-indigo-50 dark:bg-indigo-950/80 text-indigo-700 dark:text-indigo-300 text-xs font-bold">Câu ${exIdx + 1}: ${ex.type}</span>${ex.questionAudio.length ? `
                          <button onclick="TTS.playQueue(${Renderer.escapeJsonAttr(ex.questionAudio)}, 'Đề bài câu ${exIdx + 1}')" class="touch-target px-3 py-1 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold">
                            🔊 Nghe đề bài ${ex.isListening ? '(Bài nghe)' : ''}
                          </button>
                        ` : ''}
                      </div>

                      <div class="hanzi-text font-bold text-base text-slate-900 dark:text-white">${ex.prompt}</div>

                      <!-- Options -->
                      <div class="grid sm:grid-cols-2 gap-2 pt-1">
                        ${ex.options.map((opt, oIdx) => `
                          <button onclick="Renderer.submitExerciseOption('${ex.id}', ${oIdx}, ${ex.correct})"
                            class="touch-target p-3 rounded-xl border text-xs sm:text-sm font-semibold hanzi-text text-left transition flex items-center justify-between ${hasAnswered && saved.selected === oIdx ? (isCorrect ? 'bg-emerald-600 text-white border-emerald-600 shadow' : 'bg-rose-600 text-white border-rose-600 shadow') : 'bg-slate-50 dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-200'}">
                            <span>${opt}</span>
                            ${hasAnswered && oIdx === ex.correct ? '<span>✓</span>' : ''}
                          </button>
                        `).join('')}
                      </div>

                      <!-- Transcript & Explanation -->
                      ${hasAnswered ? `
                        <div class="pt-3 border-t border-slate-100 dark:border-slate-800 space-y-2 text-xs sm:text-sm">
                          <div class="font-bold ${isCorrect ? 'text-emerald-700 dark:text-emerald-400' : 'text-rose-700 dark:text-rose-400'}">
                            ${isCorrect ? '✅ ĐÚNG: ' + ex.reasonRight : '⚠️ CẦN SỬA: ' + ex.reasonWrong}
                          </div>
                          ${ex.transcript ? `
                            <div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hanzi-text text-slate-800 dark:text-slate-200">
                              <strong>📜 Bản chép lời (Transcript):</strong> ${ex.transcript}
                            </div>
                          ` : ''}
                          ${ex.explainAudio.length ? `
                            <button onclick="TTS.playQueue(${Renderer.escapeJsonAttr(ex.explainAudio)}, 'Giải thích câu ${exIdx + 1}')" class="touch-target px-3.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-xs font-semibold">
                              🔊 Nghe Audio giải thích
                            </button>
                          ` : ''}
                        </div>
                      ` : ''}
                    </div>
                  `;
                }).join('')}
              </div>
            </div>

            <!-- 2. TỰ DÙNG TỪ 3 TẦNG TRỢ GIÚP -->
            ${curGroup.selfUse.length > 0 ? `
              <div class="space-y-4">
                <h3 class="text-base font-bold text-slate-900 dark:text-white">2. Luyện tự dùng từ trong câu (3 Tầng trợ giúp)</h3>
                <div class="grid gap-4">
                  ${curGroup.selfUse.map((su, sIdx) => {
                    const draft = progress.selfUseAnswers[su.id] || '';
                    return `
                      <div class="p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 space-y-3">
                        <div class="flex items-center justify-between">
                          <span class="text-xs font-bold text-emerald-600 dark:text-emerald-400 uppercase">Tình huống ${sIdx + 1}</span>
                          ${su.questionAudio.length ? `
                            <button onclick="TTS.playQueue(${Renderer.escapeJsonAttr(su.questionAudio)}, 'Tình huống tự đặt câu')" class="touch-target px-2.5 py-1 rounded-lg bg-emerald-100 dark:bg-emerald-950 text-emerald-800 dark:text-emerald-200 text-xs font-semibold">
                              🔊 Nghe tình huống
                            </button>
                          ` : ''}
                        </div>
                        <p class="text-sm font-semibold text-slate-800 dark:text-slate-200">${su.situation}</p>

                        <div>
                          <label class="block text-xs font-semibold text-slate-500 mb-1">Nhập câu tiếng Trung của bạn (Chữ Hán):</label>
                          <input type="text" oninput="Renderer.onSaveSelfUseDraft('${su.id}', this.value)" value="${Renderer.escapeHtml(draft)}" placeholder="Nhập câu tiếng Trung để tự đối chiếu..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 hanzi-text text-base focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                        </div>

                        <!-- 3 Tầng Progressive Disclosure -->
                        <div class="space-y-2 pt-1">
                          <details class="p-3 rounded-xl bg-indigo-50/70 dark:bg-indigo-950/40 border border-indigo-200 dark:border-indigo-900 text-xs">
                            <summary class="font-bold text-indigo-900 dark:text-indigo-200 cursor-pointer">1️⃣ Mở gợi ý 1 (Ý cần nói)</summary>
                            <div class="pt-2 text-slate-700 dark:text-slate-300">
                              <p>${su.hint1}</p>
                              ${su.hint1Audio.length ? `<button onclick="TTS.playQueue(${Renderer.escapeJsonAttr(su.hint1Audio)}, 'Gợi ý 1')" class="mt-1 text-indigo-600 dark:text-indigo-400 font-semibold underline">🔊 Nghe gợi ý 1</button>` : ''}
                            </div>
                          </details>

                          <details class="p-3 rounded-xl bg-amber-50/70 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-900 text-xs">
                            <summary class="font-bold text-amber-900 dark:text-amber-200 cursor-pointer">2️⃣ Mở gợi ý 2 (Khung câu chữ Hán)</summary>
                            <div class="pt-2 text-slate-700 dark:text-slate-300">
                              <p class="hanzi-text font-bold text-sm text-amber-950 dark:text-amber-100">${su.hint2}</p>
                              ${su.hint2Audio.length ? `<button onclick="TTS.playQueue(${Renderer.escapeJsonAttr(su.hint2Audio)}, 'Gợi ý 2')" class="mt-1 text-amber-600 dark:text-amber-400 font-semibold underline">🔊 Nghe gợi ý 2</button>` : ''}
                            </div>
                          </details>

                          <details class="p-3 rounded-xl bg-emerald-50/70 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-900 text-xs">
                            <summary class="font-bold text-emerald-900 dark:text-emerald-200 cursor-pointer">3️⃣ Mở câu mẫu đối chiếu & Lời giải</summary>
                            <div class="pt-2 space-y-2">
                              <div class="hanzi-text text-base font-bold text-emerald-950 dark:text-emerald-100">✅ Câu mẫu: ${su.modelAnswer}</div>
                              <p class="text-slate-700 dark:text-slate-300">${su.modelExplain}</p>
                              ${su.modelAudio.length ? `
                                <button onclick="TTS.playQueue(${Renderer.escapeJsonAttr(su.modelAudio)}, 'Câu mẫu')" class="touch-target px-3 py-1 rounded-lg bg-emerald-700 text-white font-bold">
                                  🔊 Nghe câu mẫu
                                </button>
                              ` : ''}
                            </div>
                          </details>
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>
            ` : ''}
          </div>
        `;
      },

      // === D. MÀN HÌNH ÔN TẬP 1-3-7 NGÀY ===
      renderReviewView() {
        const curLesson = AppStore.currentLesson || AppStore.lessons[0];
        const allReviews = curLesson.groups.flatMap(g => g.reviews);

        return `
          <div class="space-y-6">
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 shadow-sm">
              <button onclick="Router.navigate('home')" class="text-xs font-bold text-amber-600 dark:text-amber-400 uppercase tracking-wider hover:underline text-left">◀ Thư viện · ${curLesson.level} • ${curLesson.title}</button>
              <h2 class="text-xl font-bold text-slate-900 dark:text-white mt-1">🔄 Ôn Tập Ngắt Quãng (Mốc 1 – 3 – 7 Ngày)</h2>
              <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-1">
                Tự suy nghĩ và trả lời trước, sau đó bấm mở khóa đáp án để đối chiếu và nghe lời giảng.
              </p>
            </div>

            <!-- Mốc 1 - 3 - 7 ngày -->
            <div class="space-y-4">
              ${[1, 3, 7].map(day => {
                const dayReviews = allReviews.filter(r => r.day === day);
                if (dayReviews.length === 0) return '';
                return `
                  <details class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm" ${day === 1 ? 'open' : ''}>
                    <summary class="font-bold text-base text-slate-900 dark:text-white cursor-pointer flex items-center justify-between">
                      <span>Mốc ôn tập Ngày ${day} (${dayReviews.length} câu hỏi)</span>
                      <span class="text-xs text-indigo-600 dark:text-indigo-400 font-semibold">Nhấn để đóng/mở</span>
                    </summary>

                    <div class="grid gap-3 pt-4">
                      ${dayReviews.map((r) => `
                        <div class="p-4 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 space-y-2.5">
                          <div class="flex items-center justify-between">
                            <span class="text-xs font-bold text-indigo-700 dark:text-indigo-300">Dạng: ${r.type}</span>
                            ${r.listenAudio.length ? `
                              <button onclick="TTS.playQueue(${Renderer.escapeJsonAttr(r.listenAudio)}, 'Nghe câu hỏi ôn tập')" class="touch-target px-2.5 py-1 rounded-lg bg-indigo-600 text-white text-xs font-semibold">
                                🔊 Nghe câu hỏi
                              </button>
                            ` : ''}
                          </div>
                          <div class="hanzi-text font-bold text-sm text-slate-900 dark:text-white">${r.q}</div>

                          <details class="text-xs pt-1">
                            <summary class="touch-target text-indigo-600 dark:text-indigo-400 font-bold cursor-pointer hover:underline">
                              🔓 Xem đáp án chuẩn & Lời giải
                            </summary>
                            <div class="pt-2 p-3 rounded-xl bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 space-y-1.5 mt-2">
                              <div class="hanzi-text text-sm font-bold text-emerald-950 dark:text-emerald-100">✅ Đáp án: ${r.answer}</div>
                              <p class="text-slate-700 dark:text-slate-300">${r.explain}</p>
                              ${r.audio.length ? `
                                <button onclick="TTS.playQueue(${Renderer.escapeJsonAttr(r.audio)}, 'Giải thích ôn tập')" class="touch-target px-3 py-1 rounded bg-emerald-700 text-white font-semibold">
                                  🔊 Nghe giảng giải đáp án
                                </button>
                              ` : ''}
                            </div>
                          </details>
                        </div>
                      `).join('')}
                    </div>
                  </details>
                `;
              }).join('')}
            </div>
          </div>
        `;
      },

      // === E. MÀN HÌNH TRA CỨU TỪ VỰNG ===
      renderSearchView() {
        const query = AppStore.searchQuery.toLowerCase().trim();
        const progress = Storage.getProgress();

        let allWords = [];
        AppStore.lessons.forEach(l => {
          l.groups.forEach(g => {
            g.words.forEach(w => {
              allWords.push({ ...w, lessonId: l.id, lessonTitle: l.title, groupId: g.id, groupTitle: g.title });
            });
          });
        });

        if (query) {
          allWords = allWords.filter(w =>
            w.hanzi.toLowerCase().includes(query) ||
            w.pinyin.toLowerCase().includes(query) ||
            w.coreMeaning.toLowerCase().includes(query)
          );
        }

        return `
          <div class="space-y-6">
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 shadow-sm space-y-3">
              <h2 class="text-xl font-bold text-slate-900 dark:text-white">Tra Cứu Từ Vựng</h2>
              <div class="relative">
                <input type="text" oninput="Renderer.onSearchInput(this.value)" value="${Renderer.escapeHtml(AppStore.searchQuery)}" placeholder="Nhập chữ Hán (右, 开车), Pinyin (kaiche) hoặc nghĩa..." class="w-full px-4 py-3 rounded-2xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
              </div>
              <div class="text-xs text-slate-400">Tìm thấy ${allWords.length} từ vựng trong ${AppStore.lessons.length} bài đã mở.</div>
              ${DataStore.manifest.length > AppStore.lessons.length ? `<div class="text-xs text-amber-600 dark:text-amber-400">Còn ${DataStore.manifest.length - AppStore.lessons.length} bài chưa mở. <button class="underline font-bold" onclick="Renderer.loadAllLessons()">Tải tất cả để tra cứu đầy đủ</button></div>` : ''}
            </div>

            <div class="grid gap-3">
              ${allWords.map(w => {
                const isDone = Boolean(progress.completedWords[w.id]);
                return `
                  <div onclick="Router.navigate('lesson', { lessonId: '${w.lessonId}', groupId: '${w.groupId}', wordId: '${w.id}' })"
                    class="cursor-pointer bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 hover:border-indigo-400 transition flex items-center justify-between gap-4 shadow-sm">
                    <div class="flex items-center gap-4">
                      <div class="w-14 h-14 rounded-xl bg-indigo-50 dark:bg-indigo-950 flex items-center justify-center text-2xl font-black text-indigo-600 dark:text-indigo-400 hanzi-text shrink-0">
                        ${w.hanzi}
                      </div>
                      <div>
                        <div class="text-xs text-slate-400 font-mono">${w.pinyin}</div>
                        <div class="text-base font-bold text-slate-900 dark:text-white">${w.coreMeaning}</div>
                        <div class="text-[11px] text-slate-400 mt-0.5">${w.groupTitle}</div>
                      </div>
                    </div>
                    <span class="text-xs font-semibold px-2.5 py-1 rounded-full ${isDone ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300' : 'bg-slate-100 dark:bg-slate-800 text-slate-500'}">
                      ${isDone ? '✓ Đã học' : 'Chưa học'}
                    </span>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      },

      // === F. MÀN HÌNH CÀI ĐẶT & QUẢN TRỊ TIẾN TRÌNH ===
      renderSettingsView() {
        const settings = Storage.getSettings();
        const voices = TTS.getVoices();
        const viVoices = voices.filter(v => v.lang.toLowerCase().startsWith('vi'));
        const zhVoices = voices.filter(v => v.lang.toLowerCase().startsWith('zh'));

        return `
          <div class="space-y-6">
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 shadow-sm">
              <h2 class="text-xl font-bold text-slate-900 dark:text-white">Cài Đặt & Dữ Liệu</h2>
              <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-1">Tùy chỉnh giọng đọc thiết bị, giao diện và sao lưu tiến trình.</p>
            </div>

            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 space-y-3">
              <h3 class="font-bold text-sm text-slate-900 dark:text-white">Học liệu</h3>
              <p class="text-xs text-slate-500 dark:text-slate-400">${DataStore.levels().length} cấp độ • ${DataStore.manifest.length} bài • ${DataStore.totalWords()} từ. Đã mở trong phiên này: ${AppStore.lessons.length} bài.</p>
              ${Object.keys(DataStore.failed).length ? `<p class="text-xs text-rose-600">⚠ ${Object.keys(DataStore.failed).length} bài tải lỗi: ${Object.keys(DataStore.failed).map(k => Renderer.escapeHtml(k)).join(', ')}</p>` : ''}
              <button onclick="Renderer.loadAllLessons()" class="chip">⬇ Tải tất cả bài</button>
              <span id="load-all-status" class="text-xs text-slate-500 ml-2"></span>
            </div>

            <!-- Tùy chỉnh giọng đọc TTS -->
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 space-y-4 shadow-sm">
              <h3 class="font-bold text-sm text-slate-900 dark:text-white">1. Cấu hình giọng đọc (Web Speech API)</h3>

              <div class="grid sm:grid-cols-2 gap-4">

      // === ACTION HANDLERS ===
      escapeJsonAttr(obj) {

      onSelectGroup(groupId) {
        if (!AppStore.currentLesson) return;
        const grp = AppStore.currentLesson.groups.find(g => g.id === groupId);
        if (grp) {
          AppStore.currentGroup = grp;
          AppStore.currentWord = grp.words[0] || null;
          this.renderCurrentView();
        }
      },

      playSequentialLecture(wordId) {
        if (!AppStore.currentGroup) return;
        const w = AppStore.currentGroup.words.find(it => it.id === wordId);
        if (!w) return;

        const queue = [];
        queue.push(...w.introAudio);
        queue.push(...w.meaning.audio);
        w.structures.forEach(st => queue.push(...st.audio));
        queue.push({ lang: "vi-VN", text: "Tiếp theo là các câu ví dụ thực tế:" });
        w.examples.forEach(ex => {
          queue.push({ lang: "zh-CN", text: ex.zh, pause: 1200 });
          queue.push({ lang: "vi-VN", text: ex.vi, pause: 600 });
        });
        w.traps.forEach(t => queue.push(...t.audio));
        if (w.summaryAudio && w.summaryAudio.length) {
          queue.push(...w.summaryAudio);
        } else if (w.summary) {
          queue.push({ lang: "vi-VN", text: "Tổng kết cách dùng: " + w.summary });
        }
        queue.push({
          lang: "vi-VN",
          text: "Đã kết thúc bài giảng lý thuyết. Hệ thống tự động dừng lại để bạn luyện tập đặt câu hoặc làm bài kiểm tra."
        });

        TTS.playQueue(queue, `Giảng tuần tự: #${w.index} (${w.hanzi})`);
      },

      checkTrapMiniQuiz(wordId, trapIdx, optionIdx) {
        if (!AppStore.currentGroup) return;
        const w = AppStore.currentGroup.words.find(it => it.id === wordId);
        if (!w || !w.traps[trapIdx] || !w.traps[trapIdx].checkQuestion) return;

        const q = w.traps[trapIdx].checkQuestion;
        const fbEl = document.getElementById(`trap-feedback-${wordId}-${trapIdx}`);
        if (!fbEl) return;

        fbEl.classList.remove('hidden');
        if (optionIdx === q.correct) {
          fbEl.className = "p-2.5 rounded-xl text-xs font-semibold bg-emerald-100 text-emerald-900 dark:bg-emerald-950 dark:text-emerald-200";
          fbEl.innerHTML = `🎉 Chính xác! ${q.explain}`;
        } else {
          fbEl.className = "p-2.5 rounded-xl text-xs font-semibold bg-amber-100 text-amber-900 dark:bg-amber-950 dark:text-amber-200";
          fbEl.innerHTML = `💡 Chưa đúng: ${q.explain}`;
        }
      },

      toggleCompleteWord(wordId) {
        const progress = Storage.getProgress();
        if (progress.completedWords[wordId]) {
          delete progress.completedWords[wordId];
        } else {
          progress.completedWords[wordId] = Date.now();
          if (!progress.reviewsSchedule[wordId]) {
            progress.reviewsSchedule[wordId] = {
              stage: 1,
              dueDate: Date.now() + 1 * 24 * 60 * 60 * 1000,
              history: []
            };
          }
        }
        Storage.saveProgress(progress);
        this.renderCurrentView();
      },

      toggleBookmark(wordId) {
        const progress = Storage.getProgress();
        progress.bookmarks[wordId] = !progress.bookmarks[wordId];
        Storage.saveProgress(progress);

      submitExerciseOption(exId, selectedIdx, correctIdx) {

          selected: selectedIdx,
          isCorrect: selectedIdx === correctIdx,
          timestamp: Date.now()
        };

      onSaveSelfUseDraft(suId, val) {

      onSelectVoice(lang, voiceURI) {

      onSetDefaultRate(rate) {

        Storage.saveSettings(s);
        const btn = document.getElementById('btn-audio-rate');
        if (btn) btn.textContent = `${rate}×`;

      setTheme(theme) {
        const s = Storage.getSettings();
        s.theme = theme;
        Storage.saveSettings(s);
        this.applyTheme(theme);
        this.renderCurrentView();
      },

      applyTheme(theme) {
        const root = document.documentElement;
        if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          root.classList.add('dark');
        } else {
          root.classList.remove('dark');
        }
      },

      setFontSize(sizePx) {
        const s = Storage.getSettings();
        s.fontSize = sizePx;
        Storage.saveSettings(s);
        document.documentElement.style.setProperty('--app-font-size', `${sizePx}px`);
        this.renderCurrentView();
      },

      onImportBackup(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          const res = Storage.importBackupJSON(e.target.result);
          if (res.success) {
            alert("Khôi phục tiến trình học thành công!");
            location.reload();
          } else {
            alert("Lỗi nhập tệp: " + res.error);
          }
        };
        reader.readAsText(file);
      },

      confirmReset() {
        if (confirm("Bạn có chắc chắn muốn xóa toàn bộ lịch sử học và tiến độ đã lưu không? Thao tác này không thể hoàn tác.")) {
          Storage.resetAll();
          location.reload();
        }
      }
    };

    // 5B. TRÌNH PHÁT NGHE THỤ ĐỘNG (PASSIVE LISTENING ENGINE)
    const PassiveStore = {
      KEY: 'HSK_PASSIVE_CFG_V1',
      defaults: { mode: 2, level: '', lessons: [], groups: [], repeat: 2, pause: 1000, order: 'seq', sleep: 'end', wake: true },
      get() {
        try {
          const raw = localStorage.getItem(this.KEY);
          return Object.assign({}, this.defaults, raw ? JSON.parse(raw) : {});
        } catch (e) { return Object.assign({}, this.defaults); }
      },
      save(cfg) { try { localStorage.setItem(this.KEY, JSON.stringify(cfg)); } catch (e) {} }
    };

    const Passive = {
      cfg: null,
      playlist: [],
      pos: 0,
      queue: [],
      qi: 0,
      playing: false,
      paused: false,
      token: 0,
      timer: null,
      watchdog: null,
      sleepTimer: null,
      sleepEndAt: 0,
      wakeLock: null,
      utter: null,
      statusText: '',

      init() {
        this.cfg = PassiveStore.get();
        this.cfg.groups = (this.cfg.groups || []).filter(x => typeof x === 'number');
        if (!Array.isArray(this.cfg.lessons)) this.cfg.lessons = [];
        document.addEventListener('visibilitychange', () => {
          if (document.visibilityState === 'visible' && this.playing) this.acquireWake();
        });
      },

      // ---------- Dữ liệu ----------
      level() {
        const lv = DataStore.levels();
        if (this.cfg.level && lv.includes(this.cfg.level)) return this.cfg.level;
        const c = AppStore.currentLesson;
        if (c && lv.includes(c.level)) return c.level;
        return lv[0] || '';
      },
      scopeLessonIds() {
        const all = DataStore.lessonsOf(this.level()).map(m => m.id);
        const sel = (this.cfg.lessons || []).filter(id => all.includes(id));
        return sel.length ? sel : all;
      },
      scopedWords() {
        const out = [];
        const gsel = this.cfg.groups || [];
        this.scopeLessonIds().forEach(id => {
          const l = DataStore.getLoaded(id);
          if (!l) return;
          l.groups.forEach((g, gi) => {
            if (gsel.length && !gsel.includes(gi)) return;
            g.words.forEach(w => out.push({ w, gid: g.id, lessonId: l.id }));
          });
        });
        return out;
      },
      scopeExpected() {
        const gsel = this.cfg.groups || [];
        let n = 0;
        this.scopeLessonIds().forEach(id => {
          const l = DataStore.getLoaded(id);
          if (l) l.groups.forEach((g, gi) => { if (!gsel.length || gsel.includes(gi)) n += g.words.length; });
          else { const e = DataStore.entry(id); if (e) n += e.words || 0; }
        });
        return n;
      },
      maxGroups() {
        let m = 0;
        this.scopeLessonIds().forEach(id => { const l = DataStore.getLoaded(id); if (l) m = Math.max(m, l.groups.length); });
        return m || 4;
      },
      autoLoad() {
        const pend = DataStore.unloadedIds(this.scopeLessonIds()).filter(id => !DataStore.failed[id] && !DataStore.loadingIds[id]);
        if (!pend.length) return;
        DataStore.ensure(pend).then(() => { if (AppStore.currentTab === 'passive') { Renderer.renderCurrentView(); } })
          .catch(() => { if (AppStore.currentTab === 'passive') Renderer.renderCurrentView(); });
        if (AppStore.currentTab === 'passive') setTimeout(() => Renderer.renderCurrentView(), 0);
      },
      setScopeToLesson(id) {
        const e = DataStore.entry(id);
        if (e) this.cfg.level = e.level;
        this.cfg.lessons = [id];
        this.cfg.groups = [];
        PassiveStore.save(this.cfg);
      },
      buildPlaylist() {
        const list = this.scopedWords().slice();
        if (this.cfg.order === 'shuffle') {
          for (let i = list.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [list[i], list[j]] = [list[j], list[i]];
          }
        }
        return list;
      },

      // ---------- Dựng hàng đợi âm thanh cho 1 từ ----------
      buildItems(entry) {
        const w = entry.w, c = this.cfg;
        const rep = Number(c.repeat) || 1, sp = Number(c.pause) || 1000;
        const zh = (text) => Array.from({ length: rep }, () => ({ lang: 'zh-CN', text, pause: sp }));
        const vi = (text, pause = 600) => ({ lang: 'vi-VN', text, pause });
        let q = [];

        if (c.mode === 1) {
          q.push(...zh(w.hanzi), vi(w.coreMeaning, 900));
        } else if (c.mode === 2) {
          q.push(...zh(w.hanzi), vi(w.coreMeaning, 700));
          const brief = w.meaning.keyPoint || w.meaning.situation;
          if (brief) q.push(vi(brief, 900));
          w.examples.forEach(ex => {
            if (ex.zh) q.push(...zh(ex.zh));
            if (ex.vi) q.push(vi(ex.vi, 900));
          });
        } else if (c.mode === 3) {
          q.push(vi(`Từ số ${w.index}.`, 400));
          q.push(...w.introAudio.map(x => ({ ...x })));
          q.push(...w.meaning.audio.map(x => ({ ...x })));
          w.structures.forEach(s => q.push(...s.audio.map(x => ({ ...x }))));
          if (w.examples.length) {
            q.push(vi('Các câu ví dụ thực tế:', 500));
            w.examples.forEach(ex => {
              if (ex.explainAudio.length) q.push(...ex.explainAudio.map(x => ({ ...x })));
              else {
                q.push({ lang: 'zh-CN', text: ex.zh, pause: 1000 });
                q.push(vi(ex.vi, 600));
              }
            });
          }
          w.traps.forEach(t => q.push(...t.audio.map(x => ({ ...x }))));
          if (w.summaryAudio.length) q.push(...w.summaryAudio.map(x => ({ ...x })));
          else if (w.summary) q.push(vi('Tổng kết: ' + w.summary, 800));
        } else {
          q.push(...zh(w.hanzi));
          w.examples.forEach(ex => { if (ex.zh) q.push(...zh(ex.zh)); });
        }

        q = q.filter(it => String(it.text || '').replace(/\[.*?\]/g, '').trim());
        if (q.length) q[q.length - 1].pause = Math.max(q[q.length - 1].pause || 0, 1500);
        return q;
      },

      // ---------- Điều khiển phát ----------
      start(fromWordId) {
        if (!('speechSynthesis' in window)) { this.setState('Thiết bị không hỗ trợ đọc giọng nói.'); return; }
        TTS.stop();
        this.statusText = '';
        const pend = DataStore.unloadedIds(this.scopeLessonIds());
        if (pend.length) {
          this.halt(true);
          this.setState('Đang tải bài học...');
          this.syncUI();
          DataStore.ensure(pend)
            .then(() => {
              Renderer.renderCurrentView();
              if (DataStore.unloadedIds(this.scopeLessonIds()).length) { this.setState('Không tải được bài học.'); this.syncUI(); return; }
              this.start(fromWordId);
            })
            .catch(e => { this.setState('Lỗi tải bài: ' + e.message); Renderer.renderCurrentView(); });
          return;
        }
        this.clearTimers();
        this.token++;
        this.playlist = this.buildPlaylist();
        if (!this.playlist.length) return;
        let idx = 0;
        if (fromWordId) { const f = this.playlist.findIndex(x => x.w.id === fromWordId); if (f >= 0) idx = f; }
        this.pos = idx;
        this.playing = true;
        this.paused = false;
        this.armSleep();
        this.acquireWake();
        this.loadWord();
      },

      loadWord() {
        const entry = this.playlist[this.pos];
        if (!entry) { this.finish('Đã phát hết danh sách.'); return; }
        this.queue = this.buildItems(entry);
        this.qi = 0;
        this.syncUI();
        this.next();
      },

      next() {
        if (!this.playing || this.paused) return;
        if (this.qi >= this.queue.length) { this.advanceWord(); return; }

        const token = this.token;
        const item = this.queue[this.qi];
        const text = String(item.text).replace(/\[.*?\]/g, '').trim();
        const lang = item.lang || 'vi-VN';
        const isZh = lang.startsWith('zh');

        const cap = document.getElementById('ps-caption');
        if (cap) cap.textContent = (isZh ? '🇨🇳 ' : '🇻🇳 ') + text;
        this.updateProgress();

        const u = new SpeechSynthesisUtterance(text);
        this.utter = u;
        u.lang = lang;
        const voice = TTS.findBestVoice(lang);
        if (voice) u.voice = voice;
        const rate = Number(Storage.getSettings().rate) || 1.0;
        u.rate = rate;

        let done = false;
        const step = () => {
          if (done || token !== this.token || !this.playing || this.paused) return;
          done = true;
          clearTimeout(this.watchdog);
          const p = typeof item.pause === 'number' ? Math.max(0, item.pause) : 350;
          this.timer = setTimeout(() => {
            if (token !== this.token) return;
            this.qi++;
            this.next();
          }, p);
        };
        u.onend = step;
        u.onerror = (e) => {
          if (e.error === 'canceled' || e.error === 'interrupted') return;
          console.warn('Passive TTS error:', e.error);
          step();
        };

        // Chốt chặn: một số trình duyệt đôi khi không bắn sự kiện onend
        clearTimeout(this.watchdog);
        this.watchdog = setTimeout(step, Math.max(6000, (text.length * (isZh ? 700 : 280)) / rate + 3000));

        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(u);
      },

      advanceWord() {
        this.pos++;
        if (this.pos >= this.playlist.length) {
          if (this.cfg.order === 'loop') this.pos = 0;
          else { this.finish('Đã phát hết danh sách.'); return; }
        }
        this.loadWord();
      },

      toggle() {
        if (!this.playing) { this.start(); return; }
        if (this.paused) {
          this.paused = false;
          this.acquireWake();
          this.syncUI();
          this.next();
        } else {
          this.paused = true;
          this.token++;
          this.clearTimers(true);
          window.speechSynthesis.cancel();
          this.syncUI();
        }
      },

      skip(delta) {
        if (!this.playing) { this.start(); if (!this.playing) return; }
        let p = this.pos + delta;
        if (p < 0) p = 0;
        if (p >= this.playlist.length) {
          if (this.cfg.order === 'loop') p = 0;
          else { this.finish('Đã phát hết danh sách.'); return; }
        }
        this.token++;
        this.clearTimers(true);
        window.speechSynthesis.cancel();
        this.pos = p;
        this.paused = false;
        this.playing = true;
        this.loadWord();
      },

      jump(wordId) { this.start(wordId); },

      // Dừng hẳn (người dùng bấm nút Dừng)
      stopAll() {
        this.halt(true);
        this.pos = 0;
        this.setState('Đã dừng');
        this.resetDisplay();
      },

      // Dừng nội bộ (đổi tab, hết giờ, hết danh sách)
      halt(silent) {
        const was = this.playing;
        this.token++;
        this.clearTimers();
        this.playing = false;
        this.paused = false;
        this.sleepEndAt = 0;
        this.releaseWake();
        if (was && 'speechSynthesis' in window) window.speechSynthesis.cancel();
        if (!silent) this.syncUI();
      },

      finish(msg) {
        this.halt(true);
        this.setState(msg);
        this.syncUI();
      },

      clearTimers(keepSleep) {
        clearTimeout(this.timer);

>${i+1}. ${this.esc(d.speakers[t.speaker])}</b>${this.b('▷ Nghe','dOne',`data-i="${i}"`)}</div><p class="v-zh v-transcript ${this.text?'':'v-hidden'}">${this.esc(t.zh)}</p><p class="v-mask ${this.text?'v-hidden':''}">••• Đang ẩn lời thoại</p><p class="v-translation ${this.translation?'':'v-hidden'}">${this.esc(t.vi)}</p><div class="v-wordlinks ${this.text?'':'v-hidden'}">${(t.wordIds||[]).map(id=>{const w=this.find(id);return w?this.b(w.hanzi,'word',`data-id="${id}"`):'';}).join('')}</div></article>`).join('')}</div><section class="v-card"><h2>Hiểu cả đoạn</h2><p>Trả lời rồi đối chiếu bằng chứng. Khi bắt đầu, lời thoại tạm ẩn để bạn tập nhớ nội dung.</p>${this.b('Làm '+d.checks.length+' câu','dQuiz','',true)}<div id="v-dialogquiz"></div></section>${this.task(d.task,d.id)}${this.recordUI()}`;},
 playD(from=0,to=this.d.turns.length-1,repeat=1,one=false){const items=[];for(let k=0;k<repeat;k++)for(let i=from;i<=to;i++){const t=this.d.turns[i];items.push({lang:'zh-CN',text:t.zh,pause:this.dialogMode==='shadow'?Math.max(2000,t.zh.length*250):600,dialogTurn:i,dialogId:this.d.id,conceal:!this.text,hold:!one&&this.dialogMode==='role'&&t.speaker===this.role,speaker:t.speaker});}TTS.playQueue(items,this.d.title);},

 answerD(id,index){if(this.dialogAnswer[id]!==undefined)return;this.dialogAnswer[id]=index;document.querySelector('#v-dialogquiz').innerHTML=this.quizHtml();if(Object.keys(this.dialogAnswer).length===this.d.checks.length){const p=this.p(),score=this.d.checks.filter(q=>this.dialogAnswer[q.id]===q.correct).length;p.dialogProgress[this.d.id]={...p.dialogProgress[this.d.id],score,answeredAt:Date.now()};this.save(p);this.msg('Đã lưu kết quả hiểu đoạn: '+score+'/'+this.d.checks.length);}},
 recordUI(){return `<section class="v-card"><h2>Ghi âm tự đối chiếu</h2><p>Ghi âm câu của bạn, nghe lại rồi so với mẫu. Không chấm phát âm tự động.</p><div class="v-row">${this.b('● Ghi âm','record')}${this.b('■ Dừng ghi','stopRecord')}</div><p id="v-recstatus" role="status"></p><audio id="v-recording" controls class="v-hidden"></audio><a id="v-download" class="v-btn v-hidden">Tải bản ghi</a><p class="v-small">Cần HTTPS/localhost và quyền micro. Bản ghi chỉ ở tạm trên trang; tải xuống trước khi chuyển màn hình.</p></section>`;},
 async recordStart(){if(this.recPending||this.record?.state==='recording')return;if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)return this.msg('Ghi âm cần HTTPS/localhost và trình duyệt hỗ trợ.');TTS.stop();Passive.halt(true);const token=++this.recToken;this.recPending=true;try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});if(token!==this.recToken){stream.getTracks().forEach(t=>t.stop());return;}this.recPending=false;this.stream=stream;const rec=this.record=new MediaRecorder(stream),chunks=[],status=document.querySelector('#v-recstatus'),a=document.querySelector('#v-recording'),link=document.querySelector('#v-download');rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=()=>{const blob=new Blob(chunks,{type:rec.mimeType});if(this.recordUrl)URL.revokeObjectURL(this.recordUrl);this.recordUrl=URL.createObjectURL(blob);if(a.isConnected){a.src=this.recordUrl;a.classList.remove('v-hidden');link.href=this.recordUrl;link.download='luyen-noi.'+(blob.type.includes('mp4')?'m4a':'webm');link.classList.remove('v-hidden');status.textContent='Đã ghi xong. Nghe lại và đối chiếu.';}stream.getTracks().forEach(t=>t.stop());};rec.start();status.textContent='Đang ghi âm…';}catch(e){this.recPending=false;this.msg('Không mở được micro. Kiểm tra quyền ghi âm.');}},
 stopRecord(){this.recToken++;this.recPending=false;if(this.record?.state==='recording')this.record.stop();if(this.stream)this.stream.getTracks().forEach(t=>t.stop());this.stream=null;},
 msg(t){let e=document.querySelector('#v-toast');if(!e){e=document.createElement('div');e.id='v-toast';e.setAttribute('role','status');document.body.append(e);}e.textContent=t;e.hidden=false;clearTimeout(this.toastTimer);this.toastTimer=setTimeout(()=>e.hidden=true,4000);}

const getP4=Storage.getProgress;
Storage.getProgress=function(){const p=getP4.call(this);for(const k of ['completedWords','completedExercises','selfUseAnswers','notes','bookmarks','reviewsSchedule'])if(!p[k]||typeof p[k]!=='object'||Array.isArray(p[k]))p[k]={};return p;};
Storage.importBackupJSON=function(s){try{const x=JSON.parse(s),obj=v=>v&&typeof v==='object'&&!Array.isArray(v);if(!obj(x.progress))throw Error('Thiếu tiến trình hợp lệ.');for(const k of ['completedWords','completedExercises','selfUseAnswers','notes','bookmarks','reviewsSchedule','activeRecall','dialogProgress','activeDrafts'])if(x.progress[k]!==undefined&&!obj(x.progress[k]))throw Error('Mục '+k+' không đúng định dạng.');for(const [k,v] of Object.entries(x.progress.activeRecall||{}))if(!obj(v)||!Number.isFinite(v.due)||!Number.isInteger(v.stage)||v.stage<0||v.stage>4)throw Error('Lịch tự nhớ không hợp lệ.');if(x.settings!==undefined&&!obj(x.settings))throw Error('Cài đặt không hợp lệ.');this.saveProgress(x.progress);if(x.settings)this.saveSettings({...this.getSettings(),...x.settings});return {success:true};}catch(e){return {success:false,error:e.message};}};
// Extend the original TTS queue with concealed captions and turns that wait for a learner.
const processV4=TTS.processNext;
TTS.processNext=function(){if(!this.isPlaying||this.isPaused)return;const item=this.queue[this.currentIndex];if(!item){document.querySelector('#v-audio-next')?.classList.add('v-hidden');return processV4.call(this);}if(item.dialogTurn!==undefined){document.querySelectorAll('.v-turn.active').forEach(e=>e.classList.remove('active'));const el=document.querySelector('#v-turn-'+item.dialogTurn);if(el){el.classList.add('active');el.scrollIntoView({block:'nearest',behavior:'smooth'});}const p=V.p();p.dialogProgress[item.dialogId]={...p.dialogProgress[item.dialogId],index:item.dialogTurn};V.save(p);}if(item.hold){this.waiting=true;this.updateLED('paused');document.querySelector('#audio-caption-bar').textContent='Đến lượt bạn · tự đáp rồi bấm Tiếp tục';document.querySelector('#v-audio-next').classList.remove('v-hidden');return;}this.waiting=false;document.querySelector('#v-audio-next').classList.add('v-hidden');processV4.call(this);if(item.conceal)document.querySelector('#audio-caption-bar').textContent=item.dialogTurn!==undefined?'Lượt '+(item.dialogTurn+1)+' · đang ẩn lời thoại':'Nghe và tự nhớ · đáp án đang ẩn';};

const handlersV4={
 go:d=>Router.navigate(d.tab),word:d=>V.openWord(d.id),star:d=>Renderer.toggleBookmark(d.id),complete:d=>Renderer.toggleCompleteWord(d.id),
 say:d=>TTS.playQueue([{text:d.text,lang:d.lang||'zh-CN',pause:0}],'Nghe câu / từ'),lecture:d=>Renderer.playSequentialLecture(d.id),meaning:d=>TTS.playQueue(V.find(d.id).meaning.audio,'Hiểu nghĩa và cách dùng'),single:d=>V.startCards(d.id),startCards:()=>V.startCards(),reveal:()=>{V.c.reveal=true;TTS.stop();Renderer.renderCurrentView();},rateCard:d=>V.rateCard(d.known==='1'),cardAudio:()=>TTS.playQueue([{lang:'zh-CN',text:V.c.items[V.c.i].hanzi,pause:0,conceal:true}],'Tự nhớ từ qua âm thanh'),openD:d=>V.openD(d.id),
 dMode:d=>{V.dialogMode=d.mode;V.text=d.mode==='read';V.translation=false;TTS.stop();V.stopRecord();Renderer.renderCurrentView();},
 dText:()=>{V.text=!V.text;document.querySelectorAll('.v-transcript,.v-wordlinks').forEach(e=>e.classList.toggle('v-hidden',!V.text));document.querySelectorAll('.v-mask').forEach(e=>e.classList.toggle('v-hidden',V.text));document.querySelector('[data-v="dText"]').textContent=V.text?'Ẩn chữ':'Hiện chữ';TTS.queue.forEach(it=>{if(it.dialogTurn!==undefined)it.conceal=!V.text});const it=TTS.queue[TTS.currentIndex];if(it?.dialogTurn!==undefined&&!TTS.waiting)document.querySelector('#audio-caption-bar').textContent=V.text?it.text:'Đang ẩn lời thoại';},

 dPlay:()=>V.playD(),dOne:d=>V.playD(+d.i,+d.i,1,true),dResume:()=>V.playD(Math.min(V.p().dialogProgress[V.d.id]?.index||0,V.d.turns.length-1)),
 dRange:()=>{const f=+document.querySelector('#v-from').value-1,t=+document.querySelector('#v-to').value-1,r=+document.querySelector('#v-repeat').value;if(!Number.isInteger(f)||!Number.isInteger(t)||f<0||t<f||t>=V.d.turns.length)return V.msg('Chọn khoảng lượt hợp lệ.');V.playD(f,t,r);},
 dQuiz:()=>{TTS.stop();V.dialogAnswer={};if(V.text)handlersV4.dText();if(V.translation)handlersV4.dTranslate();document.querySelector('#v-dialogquiz').innerHTML=V.quizHtml();document.querySelector('#v-dialogquiz').scrollIntoView({block:'start'});},dAnswer:d=>V.answerD(d.id,+d.i),record:()=>V.recordStart(),stopRecord:()=>V.stopRecord()
};

// 6. KHỞI TẠO ỨNG DỤNG (APP BOOTSTRAP)
    async function initializeApp() {
      TTS.init();
      Passive.init();

      const settings = Storage.getSettings();
      Renderer.applyTheme(settings.theme);
      document.documentElement.style.setProperty('--app-font-size', `${settings.fontSize || '16'}px`);

      DataStore.init();

      const progress = Storage.getProgress();
      const lastId = progress.lastLessonId;
      const tabAfter = 'home';

      Router.navigate(tabAfter);

      // Khôi phục bài đang học dở (tải nền)
      if (lastId && DataStore.entry(lastId)) {
        try {
          await DataStore.load(lastId);
          const l = DataStore.getLoaded(lastId);
          if (l && !AppStore.currentLesson) {
            AppStore.currentLesson = l;
            AppStore.currentGroup = l.groups.find(g => g.id === progress.lastGroupId) || l.groups[0] || null;
            if (AppStore.currentGroup) {
              AppStore.currentWord = AppStore.currentGroup.words.find(w => w.id === progress.lastWordId) || AppStore.currentGroup.words[0] || null;
            }
            Router.updateTopIndicator();
            if (AppStore.currentTab === 'home') Renderer.renderCurrentView();
          }
        } catch (e) { console.warn('Không khôi phục được bài cũ:', e.message); }
      }
    }

    window.addEventListener('DOMContentLoaded', initializeApp);
  </script>
