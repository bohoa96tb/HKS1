        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
        <span>Ôn từ</span>
      </button>
      <button onclick="Router.navigate('settings')" id="nav-btn-settings" class="nav-item">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
        <span>Cá nhân</span>
      </button>
    </div>
  </nav>

  <!-- ================= TỆP DỮ LIỆU BÀI HỌC ================= -->
  <!-- Danh mục bài học (manifest.js). Từng bài được tải khi cần từ thư mục data/ -->
  <script src="manifest.js"></script>

  <!-- ================= APPLICATION ENGINE SCRIPT ================= -->
  <script>
    /**
     * HSK AUDIO LEARNING WEB APP - CLIENT CORE ENGINE
     * Thiết kế thuần Vanilla JS, tối ưu hoàn toàn cho hợp đồng dữ liệu lesson_HSK1.js
     */

    // 1. CẤU HÌNH & HỆ THỐNG LƯU TRỮ (STORAGE)
    const APP_CONFIG = {
      STORAGE_KEY: 'HSK_STUDIO_PROGRESS_V3',
      SETTINGS_KEY: 'HSK_STUDIO_SETTINGS_V3',
      VERSION: 3.0
    };

    const Storage = {
      getSettings() {
        try {
          const raw = localStorage.getItem(APP_CONFIG.SETTINGS_KEY);
          return raw ? JSON.parse(raw) : {
            theme: 'system',
            fontSize: '16',
            rate: 1.0,
            voiceVi: '',
            voiceZh: '',
            autoAdvance: true
          };
        } catch (e) {
          return { theme: 'system', fontSize: '16', rate: 1.0, voiceVi: '', voiceZh: '', autoAdvance: true };
        }
      },
      saveSettings(settings) {
        try {
          localStorage.setItem(APP_CONFIG.SETTINGS_KEY, JSON.stringify(settings));
        } catch (e) { console.error('Lỗi lưu cấu hình:', e); }
      },
      getProgress() {
        try {
          const raw = localStorage.getItem(APP_CONFIG.STORAGE_KEY);
          return raw ? JSON.parse(raw) : {
            version: APP_CONFIG.VERSION,
            completedWords: {},
            completedExercises: {},
            selfUseAnswers: {},
            notes: {},
            bookmarks: {},
            reviewsSchedule: {},
            lastLessonId: null,
            lastGroupId: null,
            lastWordId: null
          };
        } catch (e) {
          return { version: APP_CONFIG.VERSION, completedWords: {}, completedExercises: {}, selfUseAnswers: {}, notes: {}, bookmarks: {}, reviewsSchedule: {} };
        }
      },
      saveProgress(data) {
        try {
          localStorage.setItem(APP_CONFIG.STORAGE_KEY, JSON.stringify(data));
        } catch (e) { console.error('Lỗi lưu tiến độ:', e); }
      },
      exportBackupJSON() {
        const payload = {
          version: APP_CONFIG.VERSION,
          exportedAt: new Date().toISOString(),
          settings: this.getSettings(),
          progress: this.getProgress()
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `HSK_TienDoHocTap_${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
      },
      importBackupJSON(jsonString) {
        try {
          const parsed = JSON.parse(jsonString);
          if (!parsed.progress) throw new Error("Tệp không đúng định dạng sao lưu hợp lệ.");
          this.saveProgress(parsed.progress);
          if (parsed.settings) this.saveSettings(parsed.settings);
          return { success: true };
        } catch (err) {
          return { success: false, error: err.message };
        }
      },
      resetAll() {
        localStorage.removeItem(APP_CONFIG.STORAGE_KEY);
      }
    };

    // 2. CHUẨN HÓA DỮ LIỆU HỌC LIỆU (DATA NORMALIZER)
    const DataNormalizer = {
      findRawLessons() {
        if (typeof ALL_LESSONS !== 'undefined' && Array.isArray(ALL_LESSONS)) return ALL_LESSONS;
        if (typeof window.ALL_LESSONS !== 'undefined' && Array.isArray(window.ALL_LESSONS)) return window.ALL_LESSONS;
        if (typeof LESSONS_HSK1 !== 'undefined' && Array.isArray(LESSONS_HSK1)) return LESSONS_HSK1;
        if (typeof window.LESSONS_HSK1 !== 'undefined' && Array.isArray(window.LESSONS_HSK1)) return window.LESSONS_HSK1;
        return null;
      },

      normalizeLesson(rawLesson, index) {
        if (!rawLesson) return null;
        const lessonId = String(rawLesson.id || `lesson_${index + 1}`);
        const title = rawLesson.title || `Bài học ${index + 1}`;
        const level = String(rawLesson.level || "HSK1").toUpperCase().replace(/\s+/g, "");

        const groups = (rawLesson.groups || []).map((grp, gIdx) => {
          const groupId = String(grp.id || `${lessonId}_g${gIdx + 1}`);
          const gTitle = grp.title || `Nhóm ${gIdx + 1}`;
          const gDesc = grp.desc || '';

          // Chuẩn hóa danh sách từ vựng
          const words = (grp.words || []).map((w, wIdx) => {
            const wordId = String(w.id || `${groupId}_w${wIdx + 1}`);
            const hanzi = w.hanzi || '';
            const pinyin = w.pinyin || '';
            const coreMeaning = w.coreMeaning || 'Chưa có giải nghĩa chính';

            // Intro audio
            const introAudio = Array.isArray(w.introAudio) ? w.introAudio : [
              { lang: "zh-CN", text: hanzi, pause: 400 },
              { lang: "vi-VN", text: coreMeaning, pause: 300 }
            ];

            // 5.2 Hiểu nghĩa
            const meaning = {
              situation: (w.meaning && w.meaning.situation) || 'Dùng trong giao tiếp thường nhật.',
              detail: (w.meaning && w.meaning.detail) || '',
              keyPoint: (w.meaning && w.meaning.keyPoint) || coreMeaning,
              audio: (w.meaning && Array.isArray(w.meaning.audio)) ? w.meaning.audio : []
            };

            // 5.3 Cấu trúc / Khung câu
            const structures = Array.isArray(w.structures) ? w.structures.map(st => ({
              title: st.title || 'Cách dùng cơ bản',
              pattern: st.pattern || hanzi,
              note: st.note || '',
              audio: Array.isArray(st.audio) ? st.audio : []
            })) : [];

            // 5.4 Ví dụ thực tế
            const examples = Array.isArray(w.examples) ? w.examples.map(ex => ({
              zh: ex.zh || '',
              vi: ex.vi || '',
              situation: ex.situation || '',
              analysis: ex.analysis || '',
              explainAudio: Array.isArray(ex.explainAudio) ? ex.explainAudio : []
            })) : [];

            // 5.5 Bẫy ngữ pháp (Hỗ trợ cả traps mảng và trap đơn)
            const trapsList = [];
            if (Array.isArray(w.traps)) {
              trapsList.push(...w.traps);
            } else if (w.trap && typeof w.trap === 'object') {
              trapsList.push(w.trap);
            }

            const uniqueTraps = [];
            const seenTrapNames = new Set();
            trapsList.forEach(t => {
              const name = t.name || 'Bẫy thường gặp';
              if (!seenTrapNames.has(name)) {
                seenTrapNames.add(name);
                uniqueTraps.push({
                  name: name,
                  situation: t.situation || '',
                  explanation: t.explanation || '',
                  wrong: t.wrong || '',
                  right: t.right || '',
                  tip: t.tip || '',
                  boundary: t.boundary || '',
                  comparisons: Array.isArray(t.comparisons) ? t.comparisons : [],
                  checkQuestion: t.checkQuestion && typeof t.checkQuestion === 'object' ? {
                    q: t.checkQuestion.q || '',
                    options: Array.isArray(t.checkQuestion.options) ? t.checkQuestion.options : [],
                    correct: typeof t.checkQuestion.correct === 'number' ? t.checkQuestion.correct : 0,
                    explain: t.checkQuestion.explain || ''
                  } : null,
                  audio: Array.isArray(t.audio) ? t.audio : []
                });
              }
            });

            // 5.6 Phát âm & 5.7 Mặt chữ & 5.8 Chốt dùng
            const pron = {
              guide: (w.pron && w.pron.guide) || 'Luyện đọc tròn vành rõ thanh điệu.',
              audio: (w.pron && Array.isArray(w.pron.audio)) ? w.pron.audio : []
            };
            const write = {
              desc: (w.write && w.write.desc) || 'Quan sát nét bút và cấu tạo bộ thủ.',
              audio: (w.write && Array.isArray(w.write.audio)) ? w.write.audio : []
            };
            const summary = typeof w.summary === 'string' ? w.summary : 'Nắm vững bản chất và bối cảnh sử dụng của từ.';
            const summaryAudio = Array.isArray(w.summaryAudio) ? w.summaryAudio : [];

            return {
              id: wordId,
              index: w.index || wIdx + 1,
              hanzi,
              pinyin,
              coreMeaning,
              introAudio,
              meaning,
              structures,
              examples,
              traps: uniqueTraps,
              pron,
              write,
              summary,
              summaryAudio
            };
          });

          // Chuẩn hóa bài tập trắc nghiệm & nghe hiểu
          const exercises = Array.isArray(grp.exercises) ? grp.exercises.map((ex, exIdx) => ({
            id: String(ex.id || `${groupId}_ex${exIdx + 1}`),
            type: ex.type || 'Trắc nghiệm',
            prompt: ex.prompt || ex.q || 'Chọn đáp án đúng nhất:',
            options: Array.isArray(ex.options) ? ex.options : [],
            correct: typeof ex.correct === 'number' ? ex.correct : 0,
            reasonRight: ex.reasonRight || 'Chính xác theo quy tắc ngữ pháp.',
            reasonWrong: ex.reasonWrong || 'Chưa đúng, hãy xem lại bản chất của từ.',
            transcript: ex.transcript || '',
            isListening: Boolean(ex.isListening || ex.listenAudio),
            questionAudio: Array.isArray(ex.questionAudio) ? ex.questionAudio : (Array.isArray(ex.listenAudio) ? ex.listenAudio : []),
            explainAudio: Array.isArray(ex.explainAudio) ? ex.explainAudio : []
          })) : [];

          // Chuẩn hóa phần Tự Dùng Từ (3 Tầng gợi ý)
          const rawSelfList = [];
          if (Array.isArray(grp.selfUse)) rawSelfList.push(...grp.selfUse);
          else if (grp.selfUse && typeof grp.selfUse === 'object') rawSelfList.push(grp.selfUse);

          const selfUse = rawSelfList.map((s, sIdx) => ({
            id: String(s.id || `${groupId}_su${sIdx + 1}`),
            situation: s.situation || 'Tự đặt câu dựa theo ngữ cảnh bài học:',
            hint1: s.hint1 || 'Xác định ý định giao tiếp chính.',
            hint2: s.hint2 || 'Sử dụng cấu trúc vừa học.',
            modelAnswer: s.modelAnswer || '',
            modelExplain: s.modelExplain || '',
            questionAudio: Array.isArray(s.questionAudio) ? s.questionAudio : [],
            hint1Audio: Array.isArray(s.hint1Audio) ? s.hint1Audio : [],
            hint2Audio: Array.isArray(s.hint2Audio) ? s.hint2Audio : [],
            modelAudio: Array.isArray(s.modelAudio) ? s.modelAudio : []
          }));

          // Chuẩn hóa câu hỏi ôn tập ngắt quãng 1-3-7 ngày
          const reviews = Array.isArray(grp.reviews) ? grp.reviews.map((r, rIdx) => ({
            id: String(r.id || `${groupId}_rev${rIdx + 1}`),
            day: r.day || 1,
            type: r.type || 'Nhớ nghĩa & phản xạ',
            q: r.q || r.prompt || '',
            answer: r.answer || '',
            explain: r.explain || '',
            listenAudio: Array.isArray(r.listenAudio) ? r.listenAudio : [],
            audio: Array.isArray(r.audio) ? r.audio : []
          })) : [];

          return {
            id: groupId,
            title: gTitle,
            desc: gDesc,
            words,
            exercises,
            selfUse,
            reviews
          };
        });

        return {
          id: lessonId,
          title,
          level,
          number: Number(rawLesson.number) || 0,
          desc: rawLesson.desc || '',
          groups
        };
      }
    };

    // 2B. KHO DỮ LIỆU NHIỀU CẤP ĐỘ / NHIỀU BÀI (MANIFEST + LAZY LOADING)
    const DataStore = {
      manifest: [],        // danh mục: { id, level, number, title, words, file, v }
      promises: {},        // id -> Promise đang tải
      failed: {},          // id -> thông báo lỗi
      loadingIds: {},      // id -> true khi đang tải (để hiển thị)
      lastScriptError: '',

      init() {
        window.addEventListener('error', e => {
          if (e && e.filename && /\.js/.test(e.filename)) {
            this.lastScriptError = `${e.message} (${String(e.filename).split('/').slice(-2).join('/').split('?')[0]}:${e.lineno})`;
          }
        });
        const list = Array.isArray(window.HSK_MANIFEST) ? window.HSK_MANIFEST : [];
        list.forEach(m => {
          if (!m || !m.id) return;
          this.manifest.push({
            id: String(m.id),
            level: String(m.level || 'HSK1').toUpperCase().replace(/\s+/g, ''),
            number: Number(m.number) || 0,
            title: m.title || m.id,
            desc: m.desc || '',
            words: Number(m.words) || 0,
            file: m.file || null,
            v: m.v || ''
          });
        });
        // Tương thích kiểu cũ: tệp khai báo sẵn mảng ALL_LESSONS
        const legacy = DataNormalizer.findRawLessons();
        if (legacy) legacy.forEach(r => this.register(r));
      },

      // Tệp bài học gọi hàm này: HSK_REGISTER({ ... })
      register(raw) {
        const idx = AppStore.lessons.length;
        const lesson = DataNormalizer.normalizeLesson(raw, idx);
        if (!lesson) return;
        const at = AppStore.lessons.findIndex(l => l.id === lesson.id);
        if (at >= 0) AppStore.lessons[at] = lesson; else AppStore.lessons.push(lesson);
        const count = lesson.groups.reduce((a, g) => a + g.words.length, 0);
        let e = this.entry(lesson.id);
        if (!e) {
          e = { id: lesson.id, level: lesson.level, number: lesson.number, title: lesson.title, desc: lesson.desc, words: count, file: null, v: '' };
          this.manifest.push(e);
        } else {
          e.words = count; // số từ thực tế luôn đúng hơn số khai báo
        }
        delete this.failed[lesson.id];
      },

      entry(id) { return this.manifest.find(m => m.id === id) || null; },
      getLoaded(id) { return AppStore.lessons.find(l => l.id === id) || null; },
      isLoaded(id) { return !!this.getLoaded(id); },

      levelNum(l) { const n = parseInt(String(l).replace(/\D/g, ''), 10); return isNaN(n) ? 99 : n; },
      levels() {
        return [...new Set(this.manifest.map(m => m.level))].sort((a, b) => this.levelNum(a) - this.levelNum(b) || a.localeCompare(b));
      },
      lessonsOf(level) {
        return this.manifest.filter(m => m.level === level).sort((a, b) => a.number - b.number || a.title.localeCompare(b.title));
      },
      wordsOf(level) { return this.lessonsOf(level).reduce((a, m) => a + (m.words || 0), 0); },
      totalWords() { return this.manifest.reduce((a, m) => a + (m.words || 0), 0); },

      lessonProgress(id) {
        const done = Object.keys(Storage.getProgress().completedWords || {}).filter(k => k.startsWith(id + '-')).length;
        const e = this.entry(id);
        return { done, total: e ? e.words : 0 };
      },

      load(id) {
        if (this.isLoaded(id)) return Promise.resolve();
        if (this.promises[id]) return this.promises[id];
        const e = this.entry(id);
        if (!e || !e.file) return Promise.reject(new Error(`Không có tệp dữ liệu cho bài "${id}" trong manifest.js`));
        this.loadingIds[id] = true;
        const p = new Promise((resolve, reject) => {
          const s = document.createElement('script');
          this.lastScriptError = '';
          s.src = e.file + (e.v ? `?v=${encodeURIComponent(e.v)}` : '');
          s.async = true;
          s.onload = () => {
            if (this.isLoaded(id)) resolve();
            else reject(new Error(`Tệp ${e.file} đã tải nhưng không đăng ký được bài "${id}". ${this.lastScriptError ? 'Lỗi: ' + this.lastScriptError : 'Kiểm tra lại id trong tệp và manifest.js.'}`));
          };
          s.onerror = () => reject(new Error(`Không tải được tệp ${e.file} (sai đường dẫn hoặc chưa đăng lên GitHub).`));
          document.head.appendChild(s);
        });
        this.promises[id] = p;
        const cleanup = () => { delete this.loadingIds[id]; };
        p.then(() => { cleanup(); delete this.promises[id]; }, err => { cleanup(); delete this.promises[id]; this.failed[id] = err.message; });
        return p;
      },

      ensure(ids) { return Promise.all(ids.map(id => this.load(id))); },
      unloadedIds(ids) { return ids.filter(id => !this.isLoaded(id)); }
    };
    window.HSK_REGISTER = (raw) => DataStore.register(raw);

    // 3. BỘ ĐIỀU PHỐI ÂM THANH DUAL-LANGUAGE TTS ENGINE
    const TTS = {
      queue: [],
      currentIndex: 0,
      isPlaying: false,
      isPaused: false,
      token: 0,
      timer: null,
      currentUtterance: null,
      rates: [0.75, 0.9, 1.0, 1.15, 1.25],

      init() {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.onvoiceschanged = () => this.getVoices();
        }
      },

      getVoices() {
        if (!('speechSynthesis' in window)) return [];
        return window.speechSynthesis.getVoices() || [];
      },

      findBestVoice(langCode) {
        const voices = this.getVoices();
        const settings = Storage.getSettings();

        if (langCode.startsWith('vi') && settings.voiceVi) {
          const match = voices.find(v => v.voiceURI === settings.voiceVi);
          if (match) return match;
        }
        if (langCode.startsWith('zh') && settings.voiceZh) {
          const match = voices.find(v => v.voiceURI === settings.voiceZh);
          if (match) return match;
        }

        const exact = voices.find(v => v.lang.replace('_', '-').toLowerCase() === langCode.toLowerCase());
        if (exact) return exact;
        return voices.find(v => v.lang.toLowerCase().startsWith(langCode.slice(0, 2).toLowerCase())) || null;
      },

      playQueue(items, title = "Đang giảng bài...") {
        if (typeof Passive !== 'undefined') Passive.halt(true);
        this.stop();
        if (!items || !items.length) return;
        if (!('speechSynthesis' in window)) {
          this.setUIStatus("Thiết bị không hỗ trợ Web Speech API.", false);
          return;
        }

        this.queue = items.map(it => ({ ...it }));
        this.currentIndex = 0;
        this.isPlaying = true;
        this.isPaused = false;
        this.token++;

        this.setDockVisible(true);
        this.setUIStatus(title, true);
        this.processNext();
      },

      processNext() {
        if (!this.isPlaying || this.isPaused) return;

        if (this.currentIndex >= this.queue.length) {
          this.isPlaying = false;
          this.setUIStatus("Đã phát xong lời giảng.", false);
          this.updateLED('stopped');
          return;
        }

        const localToken = this.token;
        const item = this.queue[this.currentIndex];
        const cleanText = String(item.text || '').replace(/\[.*?\]/g, '').trim();

        if (!cleanText) {
          this.currentIndex++;
          this.processNext();
          return;
        }

        const lang = item.lang || 'vi-VN';
        const langLabel = lang.startsWith('zh') ? '🇨🇳 Tiếng Trung' : '🇻🇳 Tiếng Việt';
        const captionBar = document.getElementById('audio-caption-bar');
        if (captionBar) captionBar.textContent = `[${langLabel}] ${cleanText}`;

        const utter = new SpeechSynthesisUtterance(cleanText);
        this.currentUtterance = utter;
        utter.lang = lang;

        const voice = this.findBestVoice(lang);
        if (voice) utter.voice = voice;

        const settings = Storage.getSettings();
        utter.rate = Number(settings.rate) || 1.0;

        const stepToNext = () => {
          if (localToken !== this.token || !this.isPlaying || this.isPaused) return;
          const pauseMs = typeof item.pause === 'number' ? Math.max(0, item.pause) : 350;
          this.timer = setTimeout(() => {
            if (localToken !== this.token) return;
            this.currentIndex++;
            this.processNext();
          }, pauseMs);
        };

        utter.onend = stepToNext;
        utter.onerror = (e) => {
          if (e.error === 'canceled' || e.error === 'interrupted') return;
          console.warn("TTS Error:", e.error);
          stepToNext();
        };

        this.updateLED('playing');
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utter);
      },

      togglePause() {
        if (!this.isPlaying) return;
        if (this.isPaused) {
          this.isPaused = false;
          window.speechSynthesis.resume();
          this.updateLED('playing');
          const lbl = document.getElementById('label-audio-playpause');
          if (lbl) lbl.textContent = "⏸ Tạm dừng";
          this.processNext();
        } else {
          this.isPaused = true;
          this.token++;
          clearTimeout(this.timer);
          window.speechSynthesis.cancel();
          this.updateLED('paused');
          const lbl = document.getElementById('label-audio-playpause');
          if (lbl) lbl.textContent = "▶ Tiếp tục";
        }
      },

      replay() {
        if (this.queue.length > 0) {
          this.playQueue(this.queue, "Phát lại đoạn giảng...");
        }
      },

      stop() {
        this.token++;
        clearTimeout(this.timer);
        this.isPlaying = false;
        this.isPaused = false;
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        this.updateLED('stopped');
        this.setUIStatus("Đã dừng âm thanh.", false);
        const lbl = document.getElementById('label-audio-playpause');
        if (lbl) lbl.textContent = "▶ Phát";
      },

      cycleRate() {
        const settings = Storage.getSettings();
        let curRate = Number(settings.rate) || 1.0;
        let nextIdx = (this.rates.indexOf(curRate) + 1) % this.rates.length;
        if (nextIdx < 0) nextIdx = 2;
        const newRate = this.rates[nextIdx];
        settings.rate = newRate;
        Storage.saveSettings(settings);
        const btn = document.getElementById('btn-audio-rate');
        if (btn) btn.textContent = `${newRate}×`;
      },

      setDockVisible(visible) {
        const dock = document.getElementById('audio-dock');
        if (!dock) return;
        if (visible) dock.classList.remove('translate-y-24', 'opacity-0');
        else dock.classList.add('translate-y-24', 'opacity-0');
      },

      setUIStatus(title, isPlaying) {
        const tEl = document.getElementById('audio-title-bar');
        if (tEl) tEl.textContent = title;
      },

      updateLED(state) {
        const led = document.getElementById('audio-status-led');
        if (!led) return;
        if (state === 'playing') led.className = "w-3 h-3 rounded-full bg-emerald-400 animate-ping shrink-0";
        else if (state === 'paused') led.className = "w-3 h-3 rounded-full bg-amber-400 shrink-0";
        else led.className = "w-3 h-3 rounded-full bg-slate-500 shrink-0";
      }
    };

    // 4. BỘ ĐIỀU HƯỚNG & QUẢN LÝ DỮ LIỆU (ROUTER & STORE)
    const AppStore = {
      lessons: [],
      currentLesson: null,
      currentGroup: null,
      currentWord: null,
      currentTab: 'home',
      searchQuery: '',
      libLevel: '',
      libQuery: ''
    };

    const Router = {
      navigate(tab, params = {}) {
        TTS.stop();
        if (tab !== 'passive') Passive.halt(true);
        const dockEl = document.getElementById('audio-dock');
        if (dockEl) dockEl.classList.toggle('hidden', tab === 'passive');
        AppStore.currentTab = tab;

        if (params.lessonId) {
          const l = AppStore.lessons.find(item => item.id === params.lessonId);
          if (l && AppStore.currentLesson !== l) {
            AppStore.currentLesson = l;
            AppStore.currentGroup = l.groups[0] || null;
            AppStore.currentWord = AppStore.currentGroup ? (AppStore.currentGroup.words[0] || null) : null;
          }
        }
        if (params.groupId && AppStore.currentLesson) {
          const g = AppStore.currentLesson.groups.find(item => item.id === params.groupId);
          if (g) AppStore.currentGroup = g;
        }
        if (params.wordId && AppStore.currentGroup) {
          const w = AppStore.currentGroup.words.find(item => item.id === params.wordId);
          if (w) AppStore.currentWord = w;
        }

        const progress = Storage.getProgress();
        if (AppStore.currentLesson) progress.lastLessonId = AppStore.currentLesson.id;
        if (AppStore.currentGroup) progress.lastGroupId = AppStore.currentGroup.id;
        if (AppStore.currentWord) progress.lastWordId = AppStore.currentWord.id;
        Storage.saveProgress(progress);

        this.updateNavButtons(tab);
        this.updateTopIndicator();
        Renderer.renderCurrentView();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      },

      updateTopIndicator() {
        const el = document.getElementById('top-lesson-indicator');
        if (!el) return;
        const l = AppStore.currentLesson;
        el.textContent = l ? `${l.level} • ${l.title}` : `${DataStore.levels().length} cấp độ • ${DataStore.manifest.length} bài`;
      },

      async openLesson(id, tab = 'lesson') {
        if (!DataStore.isLoaded(id)) {
          delete DataStore.failed[id];
          DataStore.loadingIds[id] = true;
          Renderer.refreshLibList();
          try { await DataStore.load(id); } catch (e) { DataStore.failed[id] = e.message; }
        }
        if (!DataStore.isLoaded(id)) { Renderer.refreshLibList(); return; }
        if (tab === 'passive') Passive.setScopeToLesson(id);
        this.navigate(tab, { lessonId: id });
      },

      updateNavButtons(tab) {
        ['home', 'lesson', 'passive', 'exercise', 'review', 'settings'].forEach(b => {
          const el = document.getElementById(`nav-btn-${b}`);
          if (!el) return;
          el.className = 'nav-item' + (b === tab ? ' on' : '');
        });
      }
    };

    // 5. BỘ TRÌNH DIỄN GIAO DIỆN (VIEW RENDERER)
    const Renderer = {
      escapeHtml(str) {
        return String(str ?? '').replace(/[&<>"']/g, c => ({
          '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
        }[c]));
      },

      highlightWord(sentence, target) {
        if (!sentence || !target) return this.escapeHtml(sentence);
        const safe = target.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const re = new RegExp(`(${safe})`, 'g');
        return this.escapeHtml(sentence).replace(re, `<span class="target-word-hl">$1</span>`);
      },

      renderCurrentView() {
        const viewport = document.getElementById('app-viewport');
        if (!viewport) return;

        if (DataStore.manifest.length === 0 && AppStore.lessons.length === 0) {
          viewport.innerHTML = this.renderEmptyDataNotice();
          return;
        }
        if (['lesson', 'exercise', 'review'].includes(AppStore.currentTab) && !AppStore.currentLesson) {
          viewport.innerHTML = this.renderPickLessonNotice();
          return;
        }

        switch (AppStore.currentTab) {
          case 'home':
            viewport.innerHTML = this.renderHomeView();
            break;
          case 'lesson':
            viewport.innerHTML = this.renderLessonView();
            break;
          case 'exercise':
            viewport.innerHTML = this.renderExerciseView();
            break;
          case 'review':
            viewport.innerHTML = this.renderReviewView();
            break;
          case 'search':
            viewport.innerHTML = this.renderSearchView();
            break;
          case 'settings':
            viewport.innerHTML = this.renderSettingsView();
            break;
          case 'passive':
            viewport.innerHTML = this.renderPassiveView();
            Passive.syncUI();
            Passive.autoLoad();
            break;
          default:
            viewport.innerHTML = this.renderHomeView();
        }
      },

      renderPickLessonNotice() {
        const loading = Object.keys(DataStore.loadingIds).length > 0;
        return `
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-8 text-center max-w-lg mx-auto my-8">
            <div class="text-4xl mb-3">${loading ? '⏳' : '📚'}</div>
            <h2 class="text-lg font-extrabold text-slate-900 dark:text-white mb-2">${loading ? 'Đang tải bài học...' : 'Chưa chọn bài học'}</h2>
            <p class="text-sm text-slate-500 mb-5">Hãy chọn cấp độ và một bài trong Thư viện.</p>
            <button onclick="Router.navigate('home')" class="touch-target px-6 py-2.5 rounded-xl bg-indigo-600 text-white font-bold text-sm">Mở Thư viện</button>
          </div>`;
      },

      async loadAllLessons() {
        const ids = DataStore.manifest.map(m => m.id).filter(id => !DataStore.isLoaded(id));
        const st = document.getElementById('load-all-status');
        let n = 0;
        for (const id of ids) {
          try { await DataStore.load(id); } catch (e) { /* lỗi hiển thị ở Thư viện */ }
          n++;
          if (st) st.textContent = `Đang tải ${n}/${ids.length}...`;
        }
        this.renderCurrentView();
      },

      renderEmptyDataNotice() {
        return `
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-8 sm:p-12 text-center max-w-lg mx-auto my-8 shadow-sm">
            <div class="w-16 h-16 bg-rose-100 dark:bg-rose-900/40 text-rose-600 rounded-2xl flex items-center justify-center text-3xl mx-auto mb-4">
              ⚠️
            </div>
            <h2 class="text-xl font-bold text-slate-900 dark:text-white mb-2">Chưa tìm thấy tệp bài học</h2>
            <p class="text-sm text-slate-600 dark:text-slate-400 mb-6 leading-relaxed">
              Không thấy danh mục bài học. Hãy đặt tệp <code>manifest.js</code> cùng thư mục với <code>index.html</code> và khai báo các bài trong <code>HSK_MANIFEST</code>; mỗi bài nằm ở thư mục <code>data/</code>.
            </p>
            <button onclick="location.reload()" class="touch-target px-6 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm shadow">
              Tải lại trang ⟳
            </button>
          </div>
        `;
      },

      // === A. TRANG CHỦ = THƯ VIỆN CẤP ĐỘ / BÀI HỌC ===
      renderHomeView() {
        const progress = Storage.getProgress();
        const levels = DataStore.levels();
        const level = AppStore.libLevel && levels.includes(AppStore.libLevel) ? AppStore.libLevel
          : (AppStore.currentLesson && levels.includes(AppStore.currentLesson.level) ? AppStore.currentLesson.level : levels[0]);
        AppStore.libLevel = level;

        const totalWords = DataStore.totalWords();
        const learned = Object.keys(progress.completedWords || {}).length;
        const pct = totalWords ? Math.min(100, Math.round(learned / totalWords * 100)) : 0;
        const C = 2 * Math.PI * 34;

        const now = Date.now();
        let due = 0;
        Object.values(progress.reviewsSchedule || {}).forEach(r => { if (r.dueDate && r.dueDate <= now) due++; });

        const cur = AppStore.currentLesson;
        const lvLessons = DataStore.lessonsOf(level);
        const lvWords = DataStore.wordsOf(level);
        const lvDone = lvLessons.reduce((a, m) => a + DataStore.lessonProgress(m.id).done, 0);

        return `
          <div class="space-y-5">
            <section class="relative overflow-hidden rounded-3xl p-6 sm:p-8 text-white" style="background:linear-gradient(135deg,#4338ca,#6d28d9 55%,#be185d);box-shadow:0 28px 50px -26px rgba(76,29,149,.9)">
              <div class="hanzi-text absolute -right-4 -top-8 text-[9rem] font-black leading-none opacity-10 select-none">汉</div>
              <div class="relative flex items-center justify-between gap-4">
                <div class="min-w-0">
                  <div class="inline-flex items-center gap-2 text-[11px] font-bold uppercase tracking-wider text-indigo-100 bg-white/15 rounded-full px-3 py-1 mb-3">

                  </div>
                  <h2 class="text-2xl sm:text-3xl font-extrabold tracking-tight leading-tight mb-2">${cur ? this.escapeHtml(cur.title) : 'Thư viện HSK'}</h2>
                  <p class="text-sm text-indigo-100/90 max-w-md leading-relaxed mb-4">
                    ${cur ? `${this.escapeHtml(cur.level)} • bài đang học dở. Tiếp tục ngay hoặc chọn bài khác bên dưới.` : 'Chọn cấp độ rồi chạm vào một bài để bắt đầu nghe giảng.'}
                  </p>
                  ${cur ? `<button onclick="Router.navigate('lesson')" class="touch-target px-5 py-2.5 rounded-2xl bg-white text-indigo-900 font-bold text-sm shadow-md">Tiếp tục học ➔</button>` : ''}

                    <circle cx="40" cy="40" r="34" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"
                      stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - pct / 100)).toFixed(1)}"></circle>
                  </svg>
                  <div class="absolute inset-0 flex flex-col items-center justify-center leading-none">
                    <span class="text-2xl font-black">${pct}%</span>
                    <span class="text-[10px] font-semibold text-indigo-100 mt-1">${learned}/${totalWords} từ</span>
                  </div>
                </div>
              </div>
            </section>

            <section class="grid grid-cols-3 gap-3">
              <button onclick="Router.navigate('passive')" class="rounded-2xl p-4 text-center text-white" style="background:linear-gradient(135deg,#6366f1,#8b5cf6);box-shadow:0 14px 28px -14px rgba(99,102,241,.9)">
                <div class="text-2xl mb-1">🎧</div>
                <div class="text-xs font-extrabold">Nghe thụ động</div>
                <div class="text-[11px] text-indigo-100">Rảnh tay</div>
              </button>
              <button onclick="Router.navigate('review')" class="relative bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 text-center">
                ${due > 0 ? `<span class="absolute top-2 right-2 min-w-[20px] h-5 px-1.5 rounded-full bg-amber-500 text-white text-[11px] font-black flex items-center justify-center">${due}</span>` : ''}
                <div class="text-2xl mb-1">🔁</div>
                <div class="text-xs font-extrabold text-slate-900 dark:text-white">Ôn 1-3-7</div>
                <div class="text-[11px] text-slate-500 dark:text-slate-400">${due} từ đến hạn</div>
              </button>
              <button onclick="Router.navigate('search')" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 text-center">
                <div class="text-2xl mb-1">🔎</div>
                <div class="text-xs font-extrabold text-slate-900 dark:text-white">Tra từ</div>
                <div class="text-[11px] text-slate-500 dark:text-slate-400">Hán / Pinyin / Nghĩa</div>
              </button>
            </section>

            <!-- Chọn cấp độ -->
            <section>
              <div class="flex gap-2 overflow-x-auto pb-1 -mx-1 px-1">
                ${levels.map(lv => {
                  const ls = DataStore.lessonsOf(lv);
                  const w = DataStore.wordsOf(lv);
                  const d = ls.reduce((a, m) => a + DataStore.lessonProgress(m.id).done, 0);
                  return `<button onclick="Renderer.setLibLevel('${lv}')" class="chip shrink-0 flex-col !items-start !py-2 !min-h-0 ${lv === level ? 'on' : ''}" style="min-width:7.2rem">
                    <span class="text-sm font-black leading-none">${lv}</span>
                    <span class="text-[10px] font-semibold opacity-80 leading-tight">${ls.length} bài · ${d}/${w} từ</span>
                  </button>`;
                }).join('')}
              </div>
            </section>

            <section class="space-y-3">
              <div class="flex items-end justify-between gap-3">
                <div>
                  <h3 class="text-base font-extrabold text-slate-900 dark:text-white">${level} · ${lvLessons.length} bài</h3>
                  <div class="text-xs text-slate-500">${lvDone}/${lvWords} từ đã học</div>
                </div>
                ${lvLessons.length > 8 ? `<input type="search" value="${this.escapeHtml(AppStore.libQuery)}" oninput="AppStore.libQuery=this.value;Renderer.refreshLibList()" placeholder="Lọc bài..." class="w-40 px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-white/80 dark:bg-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />` : ''}
              </div>
              <div id="lib-list" class="grid gap-3 sm:grid-cols-2">${this.libraryListHtml()}</div>
            </section>
          </div>
        `;
      },

      libraryListHtml() {
        const level = AppStore.libLevel;
        const q = (AppStore.libQuery || '').toLowerCase().trim();
        let list = DataStore.lessonsOf(level);
        if (q) list = list.filter(m => (m.title + ' ' + m.number).toLowerCase().includes(q));
        if (!list.length) return `<div class="text-sm text-slate-500 py-6 text-center sm:col-span-2">Chưa có bài nào${q ? ' khớp bộ lọc' : ' trong cấp độ này'}.</div>`;
        const curId = AppStore.currentLesson && AppStore.currentLesson.id;
        const grads = ['from-indigo-500 to-violet-600', 'from-sky-500 to-indigo-600', 'from-fuchsia-500 to-pink-600', 'from-emerald-500 to-teal-600'];

        return list.map((m, i) => {
          const pr = DataStore.lessonProgress(m.id);
          const p = pr.total ? Math.min(100, Math.round(pr.done / pr.total * 100)) : 0;
          const busy = !!DataStore.loadingIds[m.id];
          const err = DataStore.failed[m.id];
          return `
            <div class="bg-white dark:bg-slate-900 border ${m.id === curId ? 'border-indigo-400' : 'border-slate-200 dark:border-slate-800'} rounded-2xl p-4">
              <div class="flex items-start gap-3 cursor-pointer" onclick="Router.openLesson('${m.id}')">
                <div class="shrink-0 w-11 h-11 rounded-2xl bg-gradient-to-br ${grads[i % grads.length]} text-white font-black text-lg flex items-center justify-center shadow-md">${m.number || i + 1}</div>
                <div class="min-w-0 flex-1">
                  <h4 class="text-sm font-extrabold text-slate-900 dark:text-white leading-snug">${this.escapeHtml(m.title)}</h4>
                  <div class="text-[11px] text-slate-500 mt-0.5">${m.words || '?'} từ${DataStore.isLoaded(m.id) ? ' · đã tải' : ''}${m.id === curId ? ' · đang học' : ''}</div>

              </div>
              <div class="mt-3 flex items-center gap-3">
                <div class="flex-1 h-1.5 rounded-full bg-slate-200 dark:bg-slate-800 overflow-hidden"><div class="h-full rounded-full bg-gradient-to-r from-indigo-500 to-violet-500" style="width:${p}%"></div></div>
                <span class="text-[11px] font-semibold text-slate-500">${pr.done}/${pr.total}</span>
              </div>
              <div class="mt-3 flex gap-2">
                <button onclick="Router.openLesson('${m.id}')" ${busy ? 'disabled' : ''} class="chip flex-1 ${busy ? 'opacity-60' : ''}">${busy ? '⏳ Đang tải...' : '📖 Học'}</button>
                <button onclick="Router.openLesson('${m.id}', 'passive')" ${busy ? 'disabled' : ''} class="chip flex-1">🎧 Nghe bài này</button>
              </div>
              ${err ? `<p class="mt-2 text-xs text-rose-600 dark:text-rose-400 leading-snug">⚠ ${this.escapeHtml(err)}</p>` : ''}
            </div>`;
        }).join('');
      },

      refreshLibList() {
        const el = document.getElementById('lib-list');
        if (el) el.innerHTML = this.libraryListHtml();
      },
      setLibLevel(lv) { AppStore.libLevel = lv; AppStore.libQuery = ''; this.renderCurrentView(); },

      // === P. TAB NGHE THỤ ĐỘNG (PASSIVE LISTENING STUDIO) ===

        const c = Passive.cfg;
        const levels = DataStore.levels();
        const level = Passive.level();
        const lvLessons = DataStore.lessonsOf(level);
        const selIds = Passive.scopeLessonIds();
        const allLessonsSel = !(c.lessons && c.lessons.length) || selIds.length === lvLessons.length;
        const scoped = Passive.scopedWords();
        const expected = Passive.scopeExpected();
        const nGroups = Passive.maxGroups();
        const allGroups = !(c.groups && c.groups.length);
        const loadingN = selIds.filter(id => DataStore.loadingIds[id]).length;
        const failedMsgs = selIds.filter(id => DataStore.failed[id]).map(id => DataStore.failed[id]);
        const rate = Number(Storage.getSettings().rate) || 1.0;
        const q = v => typeof v === 'string' ? `'${v}'` : v;
        const seg = (key, items) => items.map(it =>
          `<button class="chip ${c[key] === it.v ? 'on' : ''}" onclick="Passive.setCfg('${key}', ${q(it.v)})">${it.label}</button>`).join('');

          { v: 1, icon: '⚡', t: 'Chế độ 1 · Ôn nhanh', d: 'Từ tiếng Trung → nghĩa tiếng Việt.' },
          { v: 2, icon: '🧩', t: 'Chế độ 2 · Ngấm ngữ cảnh', d: 'Từ → nghĩa → giải thích ngắn → các câu ví dụ (Trung + Việt).' },
          { v: 3, icon: '🎙️', t: 'Chế độ 3 · Bài giảng Podcast', d: 'Toàn bộ lời giảng: nghĩa, cấu trúc, ví dụ, bẫy. Bỏ qua điểm dừng làm bài tập.' },
          { v: 4, icon: '🌊', t: 'Chế độ 4 · Tắm ngôn ngữ', d: 'Chỉ tiếng Trung: từ mục tiêu và các câu ví dụ, luyện phản xạ nghe.' }
        ];
        const podcast = c.mode === 3;

        return `
          <div class="space-y-5">
            <div>
              <h2 class="text-xl sm:text-2xl font-extrabold tracking-tight text-slate-900 dark:text-white">🎧 Nghe Thụ Động (Tổng Hợp ${expected} Từ)</h2>
              <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Bật lên rồi đi bộ, làm việc nhà hoặc nghe trước khi ngủ. Không cần chạm vào màn hình.</p>
            </div>

            <div class="grid lg:grid-cols-5 gap-5 items-start">

                <div class="studio p-5 sm:p-6">
                  <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2 text-[11px] font-bold uppercase tracking-wider text-indigo-200">
                      <span id="ps-eq" class="eq"><i></i><i></i><i></i><i></i></span>
                      <span id="ps-state">Sẵn sàng</span>
                    </div>
                    <span id="ps-counter" class="text-xs font-bold text-indigo-100 glass rounded-full px-3 py-1">0 / ${expected}</span>
                  </div>

                  <div class="text-center mt-5 mb-4 min-h-[8.5rem] flex flex-col items-center justify-center">
                    <div id="ps-hanzi" class="hanzi-text text-6xl sm:text-7xl font-black leading-tight">🎧</div>
                    <div id="ps-pinyin" class="text-lg font-semibold text-indigo-200 mt-1 min-h-[1.75rem]"></div>
                    <div id="ps-meaning" class="text-sm text-indigo-100/90 mt-1 px-2">Nhấn ▶ để bắt đầu · ${expected} từ</div>
                  </div>

                  <div id="ps-caption" class="hanzi-text glass rounded-2xl px-4 py-3 text-sm text-amber-200 font-semibold text-center min-h-[3rem] flex items-center justify-center leading-snug">

                  </div>

                  <div class="mt-4 h-1.5 rounded-full bg-white/15 overflow-hidden"><div id="ps-progress" class="h-full rounded-full bg-gradient-to-r from-sky-300 to-fuchsia-300" style="width:0%"></div></div>
